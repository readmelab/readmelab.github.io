<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="robots" content="noindex,nofollow"><title>대신중 1학년 중간고사 | 터치형 실전 모의고사</title>
<style>

*{box-sizing:border-box}html{font-size:16px}body{margin:0;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;line-height:1.65}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #94b8ff;outline-offset:2px}
.shell{max-width:940px;margin:auto;padding:0 20px 110px}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:0 1px 9px #0a2e5311}header .bar{max-width:940px;margin:auto;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{border:0;background:none;color:var(--dark);font-size:16px;font-weight:850;text-align:left;padding:1px}.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}.top-tag{font-size:12px;font-weight:700;color:#3154a2;background:#e8f0ff;padding:5px 9px;border-radius:50px}
h1{font-size:clamp(24px,4vw,34px);line-height:1.25;color:#112542;margin:0 0 12px}.lead{color:var(--muted);margin:0 0 22px}.eyebrow{font-size:12px;color:#4162b1;font-weight:850;letter-spacing:.04em;margin-bottom:10px}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 10px 32px #1e376a08}.note{font-size:13px;color:var(--muted)}.muted{color:var(--muted)}.intro{padding:34px 0 8px}.subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.subject{padding:23px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 14px #1e376a0a;transition:transform .15s,border-color .15s}.subject:hover{border-color:#88a6f0;transform:translateY(-2px)}.subject b{display:block;color:var(--dark);font-size:23px;margin:8px 0 4px}.subject .scope{display:block;color:var(--muted);font-size:13px;min-height:46px}.subicon{display:inline-grid;place-items:center;background:#edf3ff;color:var(--primary);border-radius:11px;width:38px;height:38px;font-size:21px}.subfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;border-top:1px solid #eef1f6;padding-top:13px;font-size:13px;font-weight:750;color:var(--primary)}.bottom-section{margin-top:20px}.callout{background:#eff4fc;border:1px solid #d9e4f3;padding:16px;border-radius:12px;color:#425874;font-size:13px}
.exam-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:26px 0 15px}.exam-head h1{margin:3px 0 6px;font-size:28px}.timer{font-variant-numeric:tabular-nums;background:#fff;border:1px solid #dde5f2;border-radius:10px;font-weight:800;padding:7px 12px;white-space:nowrap;color:#274d8a}.timer.danger{color:#b03c41;background:#fff1f1}.progress{height:10px;border-radius:10px;background:#dbe5f5;overflow:hidden;margin-bottom:10px}.progress >div{height:100%;background:linear-gradient(90deg,#315fd6,#76a4ee);transition:width .2s}.exam-small{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px}.question-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.pill{display:inline-flex;background:#eaf0fa;color:#436184;padding:4px 10px;border-radius:100px;font-size:13px;font-weight:700}.mark{border:1px solid #d5dfee;background:#fff;border-radius:8px;padding:7px 10px;font-size:13px;color:#5a6e8b}.mark.active{color:#a46814;background:#fff7e7;border-color:#edc58c}.q-stem{white-space:pre-line;font-weight:780;line-height:1.85;font-size:19px;color:#16243b;margin:8px 0 24px}.choices{display:grid;gap:11px}.choice{display:flex;align-items:start;gap:13px;width:100%;padding:15px 16px;border-radius:11px;border:2px solid #e1e7f0;background:#fff;text-align:left;line-height:1.6;color:#23344d}.choice:hover{background:#f5f8ff;border-color:#adbfeb}.choice.selected{background:#eef4ff;border-color:#3b69d0}.circle{display:grid;place-items:center;width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:1.8px solid #abbad0;color:#667891;font-size:13px;font-weight:800;margin-top:0}.choice.selected .circle{background:var(--primary);border-color:var(--primary);color:#fff}.response{width:100%;min-height:230px;border:1.5px solid #cbd8ec;border-radius:10px;padding:14px;resize:vertical;color:var(--ink);background:#fbfdff}.entryhelp{font-size:13px;color:var(--muted);margin-top:9px}.question-foot{display:flex;justify-content:space-between;gap:9px;align-items:center;margin-top:23px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:9px 17px;border-radius:10px;border:1px solid #cdd8e8;background:#fff;color:#2a4669;font-weight:750}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.danger{color:#b34350;border-color:#edc7cc}.btn.ghost{border:0;background:transparent;color:#476489}.btn:hover:not(:disabled){filter:brightness(.98)}.pageDots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;margin-top:18px}.dot{height:34px;border-radius:7px;background:#fff;border:1px solid #d8e1ee;font-size:12px;font-weight:750;color:#6e819e}.dot.done{background:#e7f0ff;border-color:#98b7ee;color:#335caa}.dot.current{box-shadow:0 0 0 2px #547deb inset}.dot.flag{border-color:#e8bb6e}.submitbox{margin-top:19px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.submitbox .desc{font-size:13px;color:var(--muted)}
.result-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.stat{background:#f0f5ff;border:1px solid #dfebff;border-radius:12px;padding:13px}.stat small{display:block;color:#4f6280}.stat strong{font-size:22px;color:#173c7d}.review-item{padding:19px 0;border-bottom:1px solid #e4eaf2}.review-item:last-child{border-bottom:0}.review-item h3{font-size:15px;margin:4px 0;white-space:pre-line;line-height:1.7}.answer-row{font-size:13px;margin-top:8px}.correct{color:var(--good);font-weight:750}.wrong{color:var(--bad);font-weight:750}.essay-box{padding:15px;border-radius:11px;background:#f6f8fc;border:1px solid #e1e7ef;margin-top:10px;white-space:pre-line;font-size:13px}.select-score{width:130px;border:1px solid #b2c2de;border-radius:8px;padding:8px;background:#fff}.tool-actions{display:flex;flex-wrap:wrap;gap:8px}.hidden{display:none!important}.footer{font-size:12px;color:#8490a4;margin:20px 0 60px}.nudge{color:#934f19;background:#fff9ed;padding:8px 11px;border-radius:9px;margin:10px 0;font-size:12px}
@media(max-width:610px){.shell{padding:0 12px 80px}.subject-grid{grid-template-columns:1fr}.panel{padding:18px;border-radius:13px}.q-stem{font-size:17px}.exam-head h1{font-size:23px}.choice{padding:13px}.pageDots{grid-template-columns:repeat(5,minmax(0,1fr))}.result-cards{grid-template-columns:1fr 1fr}.submitbox{align-items:stretch}.question-foot{gap:8px}.btn{padding:8px 12px;font-size:14px}.exam-small{font-size:12px}}

<script type="application/json" id="examdata">[{"id":"수학","scope":"점·선·면~다각형 (원·부채꼴 제외)","items":[{"no":1,"kind":"mc","pts":3,"stem":"서로 다른 두 점 A, B를 반드시 지나는 직선은 몇 개인가?","opts":["0개","1개","2개","3개","무수히 많다"],"correct":2,"explain":"서로 다른 두 점을 지나는 직선은 오직 하나이다.","topic":"점·직선"},{"no":2,"kind":"mc","pts":3,"stem":"반직선 AB와 반직선 BA에 대한 설명으로 옳은 것은?","opts":["시작점이 같다.","언제나 같은 반직선이다.","시작점이 서로 달라 일반적으로 다른 반직선이다.","둘 다 선분이다.","길이가 각각 2배씩 다르다."],"correct":3,"explain":"반직선 AB는 A에서 시작해 B 방향, BA는 B에서 시작해 A 방향으로 뻗는다.","topic":"직선·반직선"},{"no":3,"kind":"mc","pts":3,"stem":"한 직선 위에 있지 않은 서로 다른 세 점을 모두 지나는 평면은 몇 개인가?","opts":["0개","1개","2개","3개","무수히 많다"],"correct":2,"explain":"한 직선 위에 있지 않은 세 점은 하나의 평면을 결정한다.","topic":"평면의 결정"},{"no":4,"kind":"mc","pts":3,"stem":"두 평면이 서로 만나고 일치하지 않을 때, 그 공통부분의 모양은?","opts":["점 하나","선분","직선","반직선","평면"],"correct":3,"explain":"서로 다른 두 평면이 만나면 교선은 직선이다.","topic":"평면의 위치 관계"},{"no":5,"kind":"mc","pts":3,"stem":"두 각의 크기의 합이 90°이고 한 각이 37°일 때 다른 각의 크기는?","opts":["43°","47°","53°","57°","63°"],"correct":3,"explain":"90−37=53(°).","topic":"여각"},{"no":6,"kind":"mc","pts":3,"stem":"이웃한 두 각이 한 직선을 이루고 한 각이 124°일 때, 다른 각은?","opts":["46°","56°","66°","76°","124°"],"correct":2,"explain":"일직선 위의 이웃한 두 각의 합은 180°이므로 180−124=56(°).","topic":"보각"},{"no":7,"kind":"mc","pts":3,"stem":"두 직선이 교차할 때 생기는 맞꼭지각의 성질로 옳은 것은?","opts":["합이 항상 90°이다.","합이 항상 180°이다.","크기가 같다.","서로 이웃한 각이다.","항상 직각이다."],"correct":3,"explain":"맞꼭지각의 크기는 서로 같다.","topic":"맞꼭지각"},{"no":8,"kind":"mc","pts":3,"stem":"서로 평행한 두 직선을 한 직선이 가로지를 때, 한 엇각이 68°라면 그와 짝을 이루는 엇각은?","opts":["22°","68°","90°","112°","136°"],"correct":2,"explain":"평행선에서 엇각의 크기는 같다.","topic":"평행선과 각"},{"no":9,"kind":"mc","pts":3,"stem":"두 평행선을 가로지르는 직선에서 같은 쪽의 내각 두 개의 합은?","opts":["45°","90°","120°","180°","360°"],"correct":4,"explain":"평행한 두 직선의 같은 쪽 내각은 서로 보각이다.","topic":"평행선과 각"},{"no":10,"kind":"mc","pts":3,"stem":"크기가 84°인 각을 이등분하면 각각 몇 도인가?","opts":["21°","36°","40°","42°","48°"],"correct":4,"explain":"각의 이등분선은 각을 같은 크기로 나누므로 84÷2=42(°).","topic":"각의 이등분선"},{"no":11,"kind":"mc","pts":4,"stem":"삼각형의 세 내각의 크기가 46°, 59°, x°일 때 x는?","opts":["65°","70°","75°","80°","85°"],"correct":3,"explain":"삼각형 내각의 합은 180°. x=180−46−59=75(°).","topic":"삼각형 내각"},{"no":12,"kind":"mc","pts":4,"stem":"오각형의 내각의 크기의 합은?","opts":["360°","450°","540°","630°","720°"],"correct":3,"explain":"(5−2)×180=540(°).","topic":"다각형 내각"},{"no":13,"kind":"mc","pts":4,"stem":"칠각형의 한 꼭짓점에서 그을 수 있는 대각선의 개수는?","opts":["2개","3개","4개","5개","7개"],"correct":3,"explain":"n각형의 한 꼭짓점에서 그을 수 있는 대각선은 n−3개. 7−3=4.","topic":"대각선"},{"no":14,"kind":"mc","pts":4,"stem":"팔각형의 대각선 총개수는?","opts":["12개","16개","18개","20개","24개"],"correct":4,"explain":"n(n−3)/2=8×5÷2=20(개).","topic":"대각선"},{"no":15,"kind":"mc","pts":4,"stem":"정육각형의 한 내각의 크기는?","opts":["90°","108°","120°","135°","150°"],"correct":3,"explain":"정육각형은 내각의 합 720°를 6으로 나눈다.","topic":"정다각형 내각"},{"no":16,"kind":"mc","pts":4,"stem":"정십각형의 한 외각의 크기는?","opts":["18°","24°","30°","36°","40°"],"correct":4,"explain":"정n각형 한 외각=360°÷n=36°.","topic":"정다각형 외각"},{"no":17,"kind":"mc","pts":4,"stem":"한 외각의 크기가 24°인 정다각형은?","opts":["정십이각형","정십삼각형","정십사각형","정십오각형","정십육각형"],"correct":4,"explain":"360÷24=15이므로 정십오각형.","topic":"정다각형 역산"},{"no":18,"kind":"mc","pts":4,"stem":"다각형의 모든 외각을 같은 방향으로 한 개씩 택하여 더한 값은?","opts":["90°","180°","270°","360°","꼭짓점 수에 따라 다르다"],"correct":4,"explain":"볼록다각형에서 한 꼭짓점마다 같은 방향으로 취한 외각의 합은 360°.","topic":"외각의 합"},{"no":19,"kind":"mc","pts":4,"stem":"어떤 다각형의 내각의 합이 1,260°일 때 이 다각형의 변의 개수는?","opts":["7","8","9","10","11"],"correct":3,"explain":"(n−2)×180=1260, n−2=7이므로 n=9.","topic":"다각형 역산"},{"no":20,"kind":"mc","pts":4,"stem":"어떤 다각형의 대각선 총개수가 35개이다. 이 다각형은?","opts":["팔각형","구각형","십각형","십일각형","십이각형"],"correct":3,"explain":"10×(10−3)÷2=35개이므로 십각형.","topic":"대각선 역산"},{"no":21,"kind":"essay","pts":6,"stem":"한 직선 위에 서로 다른 점 A, B, C, D가 이 순서대로 있다. 두 점을 끝점으로 하는 서로 다른 선분을 모두 쓰고, 그 개수를 구하시오.","correct":"AB, AC, AD, BC, BD, CD: 6개","rubric":"서로 다른 선분 6개 전부 4점, 개수 2점.","topic":"선분 개수"},{"no":22,"kind":"essay","pts":6,"stem":"한 삼각형에서 두 내각이 (2x+10)°, (x+20)°이고 나머지 한 내각이 60°이다. x의 값을 풀이 과정과 함께 구하시오.","correct":"(2x+10)+(x+20)+60=180 → 3x=90 → x=30","rubric":"식 세우기 3점, 계산 및 x=30 3점.","topic":"삼각형 내각"},{"no":23,"kind":"essay","pts":6,"stem":"내각의 크기의 합이 900°인 다각형에 대하여 (가) 변의 개수 (나) 대각선의 총개수를 차례로 구하시오.","correct":"(n−2)×180=900 → n=7; 대각선 7×4÷2=14개","rubric":"변의 개수 3점, 대각선 개수 3점.","topic":"다각형 종합"},{"no":24,"kind":"essay","pts":6,"stem":"어떤 정다각형의 한 내각이 150°이다. 한 외각의 크기와 변의 개수를 각각 구하고 계산 근거를 쓰시오.","correct":"한 외각 180−150=30°; 변의 개수 360÷30=12개","rubric":"외각 도출 3점, 변의 개수 및 근거 3점.","topic":"정다각형 종합"},{"no":25,"kind":"essay","pts":6,"stem":"내각의 크기가 모두 같은 볼록오각형이 있다. 그 오각형의 한 내각과 한 외각의 크기를 각각 구하고 풀이를 쓰시오.","correct":"한 내각 (5−2)×180÷5=108°, 한 외각 180−108=72°","rubric":"내각 3점, 외각 3점.","topic":"다각형 각도"}]},{"id":"국어","scope":"창비 1-2: 1-(1)~(2), 「하늘은 맑건만」, 4-(1)~(2)","items":[{"no":1,"kind":"mc","pts":3,"stem":"다음 대화를 듣고 가장 타당하게 추론할 수 있는 것은?\n가: \"비가 그쳤네. 그런데 바닥이 반짝거려.\" 나: \"우산은 접어도 되겠다.\"","opts":["밤이 되었다.","바닥이 아직 젖어 있을 가능성이 있다.","두 사람은 실내에 있다.","우산은 고장 났다.","어제는 눈이 왔다."],"correct":2,"explain":"\"비가 그쳤다\"와 \"바닥이 반짝\"이라는 단서에서 바닥이 젖었음을 추론할 수 있다.","topic":"1-(1) 추론하며 듣기"},{"no":2,"kind":"mc","pts":3,"stem":"대화 내용에 드러나지 않은 정보를 추론할 때 가장 적절한 방법은?","opts":["화자의 말투나 상황을 무시한다.","자신의 편견을 사실로 단정한다.","말과 상황에 나타난 단서를 함께 고려한다.","첫 문장만 듣고 결론 내린다.","반드시 문자 그대로만 해석한다."],"correct":3,"explain":"언어적·비언어적 단서와 맥락을 함께 고려해야 한다.","topic":"1-(1) 추론하며 듣기"},{"no":3,"kind":"mc","pts":3,"stem":"\"괜찮아.\"라는 말의 숨은 뜻을 추론하는 데 가장 도움이 되는 자료는?","opts":["말하는 사람의 목소리와 표정","대화 장소의 건물 높이","달력의 글씨체","대화문 줄 수","말하는 사람의 키"],"correct":1,"explain":"같은 말이라도 억양·표정·상황에 따라 의미가 달라진다.","topic":"1-(1) 말의 숨은 뜻"},{"no":4,"kind":"mc","pts":3,"stem":"다음 글을 읽고 추론한 내용으로 가장 적절한 것은?\n\"지현은 창밖의 운동장을 오래 바라보았다. 책상 위에는 체육대회 신청서가 접힌 채 놓여 있었다.\"","opts":["지현은 이미 반대표로 출전했다.","지현은 체육대회에 관심이 전혀 없다.","지현은 참가 여부를 고민하고 있을 수 있다.","체육대회가 취소되었다.","지현은 운동장에 서 있다."],"correct":3,"explain":"바깥을 바라보는 행동과 접힌 신청서를 단서로 갈등·고민을 추론할 수 있다.","topic":"1-(2) 추론하며 읽기"},{"no":5,"kind":"mc","pts":3,"stem":"추론하며 읽기의 올바른 설명은?","opts":["글에 없는 정보를 근거 없이 만들어 내는 것이다.","글에 명시된 내용과 배경지식을 연결하여 의미를 짐작하는 것이다.","어휘를 사전 뜻대로만 해석하는 것이다.","필자의 주장에 무조건 동의하는 것이다.","글의 첫째 문장만 보는 것이다."],"correct":2,"explain":"글의 단서와 관련 배경지식에 기반해 추론한다.","topic":"1-(2) 추론하며 읽기"},{"no":6,"kind":"mc","pts":3,"stem":"\"그는 숙제를 다 했다는 친구의 말에 노트를 슬쩍 바라보았다.\"의 행동에 대한 추론으로 가장 타당한 것은?","opts":["친구의 말을 확인하려는 마음이 있을 수 있다.","친구에게 무조건 화를 내고 있다.","노트를 잃어버렸다.","곧바로 집에 가려고 한다.","친구의 말을 믿는다는 사실이 확정된다."],"correct":1,"explain":"\"노트를 바라봄\"은 사실 확인 욕구를 시사하지만 확정할 수는 없다.","topic":"1-(2) 행동 추론"},{"no":7,"kind":"mc","pts":3,"stem":"글을 읽고 추론한 내용이 적절한지 점검하는 기준으로 가장 적절한 것은?","opts":["내 취향에 맞는가?","친구들도 같은 답을 선택했는가?","글 속 단서로 뒷받침되는가?","문장이 길게 쓰였는가?","낯선 낱말이 많은가?"],"correct":3,"explain":"합리적인 추론은 텍스트의 근거로 검증할 수 있어야 한다.","topic":"1단원 추론 근거"},{"no":8,"kind":"mc","pts":3,"stem":"현덕의 「하늘은 맑건만」에서 문기가 겪는 핵심 내적 갈등은?","opts":["공부와 운동 중 무엇을 선택할 것인가","잘못을 숨기려는 마음과 양심에 따라 고백하려는 마음의 충돌","전학과 유학 중 선택","운동회 참가 여부","새 옷을 살지 말지 고민"],"correct":2,"explain":"문기는 잘못한 일에 대한 죄책감과 이를 바로잡으려는 양심 사이에서 갈등한다.","topic":"「하늘은 맑건만」 갈등"},{"no":9,"kind":"mc","pts":3,"stem":"「하늘은 맑건만」의 주인공 이름은?","opts":["수만","문기","영희","기수","철수"],"correct":2,"explain":"주인공은 문기이다.","topic":"「하늘은 맑건만」 인물"},{"no":10,"kind":"mc","pts":3,"stem":"「하늘은 맑건만」에서 문기를 괴롭히는 죄책감의 출발점과 가장 관련 깊은 사건은?","opts":["시험 중 부정행위","고깃간 거스름돈과 관련된 잘못","운동장에서 다툼","책을 잃어버린 일","지각을 한 일"],"correct":2,"explain":"고깃간 심부름에서 거스름돈과 관련된 잘못이 중요한 계기이다.","topic":"「하늘은 맑건만」 사건"},{"no":11,"kind":"mc","pts":4,"stem":"「하늘은 맑건만」에서 수만의 역할에 대한 설명으로 가장 적절한 것은?","opts":["문기의 양심적 결단을 돕는 담임 교사이다.","문기와 관련된 잘못을 둘러싼 갈등을 심화하는 인물이다.","가게 주인이다.","문기의 동생이다.","사건과 아무 관련이 없는 행인이다."],"correct":2,"explain":"수만은 문기의 잘못과 그 뒤의 갈등을 심화시키는 인물이다.","topic":"「하늘은 맑건만」 인물 관계"},{"no":12,"kind":"mc","pts":4,"stem":"작품 제목 「하늘은 맑건만」과 문기의 마음을 연결한 설명으로 가장 적절한 것은?","opts":["맑은 하늘은 문기의 양심의 고통과 대비된다.","맑은 하늘은 시험 범위를 뜻한다.","맑은 하늘은 실내 배경을 뜻한다.","날씨와 심리는 언제나 일치한다.","문기의 마음도 처음부터 끝까지 평온하다."],"correct":1,"explain":"맑은 하늘이라는 외부 풍경은 죄책감으로 어두운 문기의 내면과 대비된다.","topic":"「하늘은 맑건만」 제목"},{"no":13,"kind":"mc","pts":4,"stem":"「하늘은 맑건만」의 중심 주제로 가장 적절한 것은?","opts":["친구와의 경쟁에서 승리하기","가난한 사람은 언제나 죄가 있다는 것","잘못을 돌아보고 양심과 정직함을 지키는 삶","도시 생활의 편리함","과학 기술의 발전"],"correct":3,"explain":"잘못을 반성하고 정직한 삶을 추구하는 성장의 의미가 핵심이다.","topic":"「하늘은 맑건만」 주제"},{"no":14,"kind":"mc","pts":4,"stem":"\"학교 복도에 정수기를 더 설치해야 한다.\"는 주장을 뒷받침하는 근거로 가장 적절한 것은?","opts":["나는 파란색을 좋아한다.","실제 쉬는 시간에 대기하는 학생 수와 평균 대기 시간 조사","우리 반은 운동을 잘한다.","정수기는 멋있게 생겼다.","친구가 그냥 좋다고 했다."],"correct":2,"explain":"주장과 직접 관련된 객관적인 조사 자료가 적절하다.","topic":"4-(1) 근거를 들어 글 쓰기"},{"no":15,"kind":"mc","pts":4,"stem":"설득하는 글의 기본 구조로 가장 적절한 것은?","opts":["주장 → 근거 → 마무리","제목 → 광고 → 노래","결론 없이 사례 나열","근거 없이 비난","사실과 의견을 구별하지 않기"],"correct":1,"explain":"명확한 주장과 관련 근거, 마무리가 필요하다.","topic":"4-(1) 글의 구성"},{"no":16,"kind":"mc","pts":4,"stem":"다음 중 주장을 뒷받침하는 자료를 사용할 때 가장 먼저 확인할 것은?","opts":["자료의 출처와 신뢰성","그림의 크기","글자 색상","자료를 공유한 친구 수","자료에 붙인 이모티콘"],"correct":1,"explain":"출처·작성 시기·조사 방법·관련성 등을 검토해야 한다.","topic":"4-(1) 자료의 신뢰성"},{"no":17,"kind":"mc","pts":4,"stem":"\"학교 주변 교통안전을 강화하자\"는 주장에 가장 적절한 반론 예상은?","opts":["자동차는 모두 빨간색이다.","안전시설 설치에 비용이 든다.","하늘은 파랗다.","안전은 중요하지 않다.","공부는 어렵다."],"correct":2,"explain":"현실적인 비용 문제를 고려한 반론을 예상해 설득력을 높인다.","topic":"4-(1) 반론 고려"},{"no":18,"kind":"mc","pts":4,"stem":"개인 인터넷 방송을 비판적으로 시청하는 태도로 옳은 것은?","opts":["조회수가 높으면 무조건 사실로 믿는다.","광고·협찬 표시와 정보의 출처를 확인한다.","자극적인 제목은 언제나 정확하다.","댓글 수가 많으면 실험 없이 믿는다.","진행자의 말은 검증할 필요가 없다."],"correct":2,"explain":"정보의 신뢰성과 상업적 의도 및 편집 효과를 점검해야 한다.","topic":"4-(2) 매체 읽기"},{"no":19,"kind":"mc","pts":4,"stem":"대중 매체와 개인 인터넷 방송의 특성에 대한 설명으로 가장 적절한 것은?","opts":["모든 매체는 정보 전달 방식과 제작 환경이 동일하다.","개인 인터넷 방송은 시청자와 실시간 소통할 수 있는 경우가 있다.","개인 방송에서는 광고가 금지된다.","방송 화면에 나온 정보는 항상 사실이다.","대중 매체는 의견을 전할 수 없다."],"correct":2,"explain":"개인 인터넷 방송은 댓글·채팅 등 실시간 상호작용이 가능할 수 있다.","topic":"4-(2) 매체 특성"},{"no":20,"kind":"mc","pts":4,"stem":"영상에서 한 사람의 발언 중 일부만 잘라 보여 주었다. 가장 적절한 반응은?","opts":["그 영상만으로 발언의 전체 의도를 확정한다.","조회수가 높으면 그대로 전파한다.","전후 맥락과 원본 내용을 살펴본다.","단어 하나만으로 인물을 평가한다.","편집은 의미에 영향을 주지 않는다."],"correct":3,"explain":"편집된 영상은 맥락이 빠질 수 있으므로 전체 내용을 확인해야 한다.","topic":"4-(2) 영상 편집"},{"no":21,"kind":"essay","pts":6,"stem":"\"민지는 점심시간에 급식실 앞을 서성이다가 가방에서 도시락을 꺼냈다.\"라는 문장을 읽고, 민지의 상황을 하나 추론하고 글 속 단서 두 가지를 쓰시오.","correct":"예: 민지는 급식을 먹지 않을 생각일 수 있다. 단서: 급식실 앞을 서성임 / 도시락을 꺼냄.","rubric":"추론의 타당성 2점, 단서 2개 각 2점. 확정할 수 없는 내용을 단정하면 감점.","topic":"1단원 추론"},{"no":22,"kind":"essay","pts":6,"stem":"「하늘은 맑건만」에서 문기가 느끼는 죄책감을 발생시킨 사건과, 그로 인해 생긴 내적 갈등을 각각 한 문장으로 쓰시오.","correct":"거스름돈과 관련해 잘못된 행동을 한 일이 죄책감의 계기다. 그 잘못을 숨기고 싶은 마음과 고백하고 바로잡고 싶은 양심이 충돌한다.","rubric":"사건 3점, 내적 갈등 3점.","topic":"「하늘은 맑건만」 갈등"},{"no":23,"kind":"essay","pts":6,"stem":"\"학교에 자전거 보관대를 늘려야 한다.\"는 주장에 활용할 수 있는 객관적 근거 한 가지와, 그 근거를 확인할 조사 방법 한 가지를 쓰시오.","correct":"예: 현재 보관대가 부족해 자전거를 통로에 세우는 학생이 많다. 등교 시간대 보관대 이용 대수와 통로 주차 대수를 조사한다.","rubric":"관련 근거 3점, 검증 가능한 조사 방법 3점.","topic":"4-(1) 논증"},{"no":24,"kind":"essay","pts":6,"stem":"\"어떤 음식만 먹으면 시험 성적이 무조건 오른다\"는 개인 방송의 주장에 대하여 확인해야 할 사항 세 가지를 쓰시오.","correct":"예: 근거 연구의 존재, 광고·협찬 여부, 주장에 과장이 있는지(표본·조건·출처 포함).","rubric":"신뢰성 확인 항목 3개 각 2점.","topic":"4-(2) 미디어 리터러시"},{"no":25,"kind":"essay","pts":6,"stem":"추론하며 읽기와 근거를 들어 글 쓰기의 공통점을 \"근거\"라는 단어를 반드시 포함하여 두 문장 이내로 설명하시오.","correct":"추론하며 읽기는 글 속 근거를 활용하여 숨은 뜻을 짐작한다. 근거를 들어 글 쓰기는 주장을 믿을 만하게 뒷받침하는 근거를 제시한다.","rubric":"읽기 활동과 근거 관계 3점, 쓰기 활동과 근거 관계 3점.","topic":"통합 서술"}]},{"id":"과학","scope":"힘의 작용 / 열","items":[{"no":1,"kind":"mc","pts":3,"stem":"힘이 작용한 결과로 보기 어려운 것은?","opts":["공을 차면 공의 속력이 변한다.","고무줄을 잡아당기면 늘어난다.","달리는 자전거가 방향을 바꾼다.","가만히 있는 돌이 아무 원인 없이 스스로 위로 솟는다.","말랑한 공을 누르면 모양이 변한다."],"correct":4,"explain":"힘은 물체의 모양이나 운동 상태를 바꿀 수 있다.","topic":"힘의 작용"},{"no":2,"kind":"mc","pts":3,"stem":"힘의 크기를 나타내는 단위는?","opts":["m","kg","N","℃","s"],"correct":3,"explain":"힘의 국제단위는 N(뉴턴)이다.","topic":"힘의 단위"},{"no":3,"kind":"mc","pts":3,"stem":"용수철 저울을 이용하여 직접 측정하는 물리량은?","opts":["질량","힘의 크기","부피","밀도","온도"],"correct":2,"explain":"용수철 저울은 힘(무게)의 크기를 측정한다.","topic":"힘의 측정"},{"no":4,"kind":"mc","pts":3,"stem":"지표면 부근에서 물체에 작용하는 중력의 방향은?","opts":["언제나 동쪽","언제나 서쪽","지구 중심 방향","물체의 이동 방향","지면과 나란한 방향"],"correct":3,"explain":"중력은 지구 중심을 향해 작용한다.","topic":"중력"},{"no":5,"kind":"mc","pts":3,"stem":"같은 장소에서 질량이 2 kg인 물체의 무게가 20 N일 때, 질량 5 kg인 물체의 무게는?","opts":["10 N","25 N","40 N","50 N","100 N"],"correct":4,"explain":"같은 장소에서는 무게가 질량에 비례한다. 20÷2×5=50 N.","topic":"중력 계산"},{"no":6,"kind":"mc","pts":3,"stem":"고무줄을 늘렸을 때 원래 모양으로 돌아가려는 힘은?","opts":["중력","부력","탄성력","마찰력","자기력"],"correct":3,"explain":"탄성력은 변형된 물체가 원래 상태로 돌아가려는 힘이다.","topic":"탄성력"},{"no":7,"kind":"mc","pts":3,"stem":"바닥에서 상자를 밀 때 미는 방향과 반대로 운동을 방해하는 힘은?","opts":["부력","마찰력","탄성력","중력","전기력"],"correct":2,"explain":"마찰력은 접촉면에서 상대 운동 또는 운동하려는 경향을 방해하는 방향으로 작용한다.","topic":"마찰력"},{"no":8,"kind":"mc","pts":3,"stem":"물속에 완전히 잠긴 물체에 작용하는 부력의 방향은?","opts":["위쪽","아래쪽","왼쪽","오른쪽","항상 운동 방향"],"correct":1,"explain":"유체가 물체에 가하는 부력은 위쪽이다.","topic":"부력"},{"no":9,"kind":"mc","pts":3,"stem":"물체를 물에 넣어 용수철 저울로 재었더니 눈금이 공기 중보다 작아졌다. 가장 적절한 설명은?","opts":["중력이 사라졌다.","물속에서는 질량이 작아진다.","물체에 위쪽 방향의 부력이 작용한다.","용수철 저울은 고장 났다.","물속에서 온도가 반드시 상승한다."],"correct":3,"explain":"부력 때문에 용수철 저울이 받는 힘(겉보기 무게)이 감소한다.","topic":"부력의 크기"},{"no":10,"kind":"mc","pts":3,"stem":"힘이 작용할 때 물체의 운동 상태 변화에 대한 설명으로 옳은 것은?","opts":["힘은 물체의 방향을 바꿀 수 없다.","힘은 물체의 속력이나 운동 방향을 바꿀 수 있다.","힘은 오직 모양만 바꾼다.","물체가 운동하려면 항상 운동 방향으로 힘이 있어야 한다.","운동 중인 물체에는 중력이 없다."],"correct":2,"explain":"힘은 물체의 속력과 방향을 변화시킬 수 있다.","topic":"힘과 운동"},{"no":11,"kind":"mc","pts":4,"stem":"온도에 관한 설명으로 가장 적절한 것은?","opts":["온도는 물체의 질량과 같다.","온도는 입자 운동의 활발한 정도와 관련 있다.","같은 물질이면 온도는 늘 같다.","온도는 뉴턴으로 나타낸다.","온도와 열은 같은 개념이다."],"correct":2,"explain":"물질을 이루는 입자의 운동과 온도는 관련이 있다.","topic":"온도"},{"no":12,"kind":"mc","pts":4,"stem":"온도가 서로 다른 두 물체를 접촉시킬 때 열의 이동 방향은?","opts":["차가운 곳에서 뜨거운 곳으로만","뜨거운 곳에서 차가운 곳으로","항상 아래쪽","온도가 같아질 때까지 양쪽 모두 온도 상승","질량이 작은 쪽에서 큰 쪽으로"],"correct":2,"explain":"열은 온도가 높은 쪽에서 낮은 쪽으로 이동한다.","topic":"열의 이동"},{"no":13,"kind":"mc","pts":4,"stem":"뜨거운 물과 찬물을 단열된 용기에서 섞었을 때 열평형에 도달하면?","opts":["두 물의 온도가 서로 같아진다.","뜨거웠던 물만 0℃가 된다.","찬물만 100℃가 된다.","열은 영원히 한 방향으로 계속 이동한다.","두 물의 질량이 같아진다."],"correct":1,"explain":"열평형 상태에서는 접촉한 물체의 온도가 같아져 순열 이동이 없다.","topic":"열평형"},{"no":14,"kind":"mc","pts":4,"stem":"쇠숟가락을 뜨거운 국에 담그면 손잡이까지 뜨거워진다. 주요 열전달 방식은?","opts":["대류","복사","전도","증발","응결"],"correct":3,"explain":"금속 고체 내부에서 열이 전달되는 전도이다.","topic":"전도"},{"no":15,"kind":"mc","pts":4,"stem":"냄비 속 물을 아래에서 가열하면 따뜻해진 물이 위쪽으로 올라가는 주요 현상은?","opts":["대류","복사","전도","용해","승화"],"correct":1,"explain":"액체 자체가 이동하며 열을 전달하는 대류이다.","topic":"대류"},{"no":16,"kind":"mc","pts":4,"stem":"태양빛이 지구까지 도달하면서 열에너지를 전달하는 방식은?","opts":["전도","대류","복사","전기 분해","마찰"],"correct":3,"explain":"진공에서도 전달되는 복사에 해당한다.","topic":"복사"},{"no":17,"kind":"mc","pts":4,"stem":"동일한 양의 열을 질량이 같은 서로 다른 두 물질에 가했더니 A의 온도가 더 크게 올랐다. 바르게 비교한 것은?","opts":["A의 비열이 더 크다.","A의 비열이 더 작다.","두 물질의 비열은 항상 같다.","A의 질량이 더 크다.","열을 전달하지 않았다."],"correct":2,"explain":"같은 질량과 공급 열량에서 비열이 작을수록 온도 변화가 크다.","topic":"비열 비교"},{"no":18,"kind":"mc","pts":4,"stem":"다음 중 일반적으로 열팽창을 고려하여 설계한 사례는?","opts":["철길 이음매에 틈을 둔다.","물체의 질량을 0으로 만든다.","진공에서 대류를 일으킨다.","중력을 없앤다.","빛을 차단하면 소리가 사라진다."],"correct":1,"explain":"철길이 온도 상승 시 늘어나는 것을 고려해 이음매 등에 여유를 둔다.","topic":"열팽창"},{"no":19,"kind":"mc","pts":4,"stem":"같은 조건에서 비열이 큰 물질의 특징으로 가장 적절한 것은?","opts":["같은 열을 받아도 온도가 비교적 적게 오른다.","반드시 밀도가 가장 크다.","항상 열팽창하지 않는다.","반드시 전기가 통하지 않는다.","질량이 언제나 작다."],"correct":1,"explain":"비열이 클수록 같은 질량에 같은 열을 공급할 때 온도 변화가 작다.","topic":"비열"},{"no":20,"kind":"mc","pts":4,"stem":"같은 컵에 담긴 뜨거운 물이 식어 실내 온도에 가까워지는 과정을 설명한 것으로 옳은 것은?","opts":["물이 주변으로 열을 잃는다.","주변의 열이 계속 뜨거운 물에만 들어간다.","뜨거운 물의 질량이 0이 된다.","분자 운동이 완전히 멈춘다.","열전달은 복사로만 일어난다."],"correct":1,"explain":"높은 온도의 물에서 주변의 낮은 온도 물체·공기로 열이 이동한다.","topic":"열평형 응용"},{"no":21,"kind":"essay","pts":6,"stem":"질량 3 kg인 물체의 무게가 30 N인 장소에서 질량 7 kg인 물체의 무게를 구하고 비례 관계를 설명하시오.","correct":"무게는 질량에 비례하므로 30÷3×7=70 N.","rubric":"비례 관계 2점, 계산식 2점, 답과 단위 2점.","topic":"중력 계산"},{"no":22,"kind":"essay","pts":6,"stem":"공기 중 용수철 저울 눈금이 18 N인 물체를 물에 완전히 잠기게 했더니 12 N을 가리켰다. 부력의 크기와 방향을 쓰고 계산 과정을 나타내시오.","correct":"부력=18−12=6 N, 방향은 위쪽.","rubric":"뺄셈 및 부력 크기 4점, 방향 2점.","topic":"부력 실험"},{"no":23,"kind":"essay","pts":6,"stem":"20℃ 물체와 60℃ 물체를 외부와 열교환이 없는 상태에서 접촉시켰다. 열의 이동 방향과 열평형의 뜻을 서술하시오.","correct":"60℃ 물체에서 20℃ 물체로 열이 이동한다. 열평형은 두 물체의 온도가 같아져 순열 이동이 없는 상태다.","rubric":"방향 2점, 열평형 상태·온도 같음 4점.","topic":"열평형"},{"no":24,"kind":"essay","pts":6,"stem":"전도·대류·복사를 구별하여 각각 생활 속 예시를 한 가지씩 제시하시오.","correct":"전도: 뜨거운 국에 담근 금속 숟가락 손잡이 가열. 대류: 냄비 속 물의 순환. 복사: 햇빛의 열을 느낌.","rubric":"세 방식에 맞는 예시 각각 2점.","topic":"열전달 종합"},{"no":25,"kind":"essay","pts":6,"stem":"질량이 같은 A와 B에 같은 양의 열을 주었다. A의 온도는 5℃, B의 온도는 15℃ 상승했다. 어느 물질의 비열이 더 큰지 쓰고 까닭을 설명하시오.","correct":"A의 비열이 더 크다. 동일 질량과 공급 열량에서 온도 변화가 작은 물질의 비열이 크기 때문이다.","rubric":"정답 A 2점, 동일 열량·질량 언급 2점, 온도 변화-비열 관계 2점.","topic":"비열 비교"}]},{"id":"영어","scope":"동아(윤정미) 중1 5과·6과, 2022 개정","items":[{"no":1,"kind":"mc","pts":3,"stem":"빈칸에 알맞은 것은? \"My sister is ______ than I am.\"","opts":["tall","taller","tallest","the tallest","more tall"],"correct":2,"explain":"두 대상을 비교하고 than이 있으므로 taller.","topic":"L5 비교급"},{"no":2,"kind":"mc","pts":3,"stem":"다음 중 문법적으로 옳은 문장은?","opts":["She is the taller student in our class.","The blue box is heavier than the red one.","This puzzle is more easy than that one.","Tom is most tall in his family.","My dog is gooder than yours."],"correct":2,"explain":"heavy→heavier. 비교 대상 2개에 than 사용.","topic":"L5 비교급"},{"no":3,"kind":"mc","pts":3,"stem":"빈칸에 알맞은 것은? \"This is ______ movie of the three.\"","opts":["interesting","more interesting","the most interesting","most interesting than","interestinger"],"correct":3,"explain":"셋 이상 가운데 가장 ~이므로 the most interesting.","topic":"L5 최상급"},{"no":4,"kind":"mc","pts":3,"stem":"\"good\"의 비교급과 최상급을 바르게 짝지은 것은?","opts":["gooder–goodest","more good–most good","better–best","best–better","well–good"],"correct":3,"explain":"good–better–best는 불규칙 변화.","topic":"L5 불규칙 변화"},{"no":5,"kind":"mc","pts":3,"stem":"빈칸에 알맞은 것은? \"There ______ three clues on the desk.\"","opts":["is","am","are","be","was"],"correct":3,"explain":"뒤 명사구 three clues가 복수이므로 are.","topic":"L5 There are"},{"no":6,"kind":"mc","pts":3,"stem":"다음 중 문법적으로 옳은 문장은?","opts":["There are a book on the table.","There is two boys outside.","There is some juice in the bottle.","There am many questions.","There be a pencil here."],"correct":3,"explain":"셀 수 없는 명사 some juice는 단수 취급하므로 There is.","topic":"L5 There is"},{"no":7,"kind":"mc","pts":3,"stem":"빈칸에 가장 알맞은 것은? \"A detective should look ______ at the small details.\"","opts":["care","careful","carefully","carefulness","more carefulest"],"correct":3,"explain":"동사 look(살펴보다)을 수식하는 부사 carefully.","topic":"L5 단서 관찰"},{"no":8,"kind":"mc","pts":3,"stem":"다음 대화의 빈칸에 알맞은 것은?\nA: \"May I check this notebook?\"\nB: \"______ You can use it.\"","opts":["Of course.","Never mind.","I have no idea.","Not at all.","That is impossible."],"correct":1,"explain":"허락을 구하는 질문에 Of course로 허락한다.","topic":"L5 대화·허락"},{"no":9,"kind":"mc","pts":3,"stem":"다음 글을 읽고 알 수 있는 것은?\n\"Mina found wet shoes near the door. The floor outside was dry. She looked at the umbrella in the corner and smiled.\"","opts":["It was snowing inside.","Mina noticed clues about someone coming in from the rain.","Mina bought new shoes.","The umbrella was broken.","The floor was wet everywhere."],"correct":2,"explain":"젖은 신발과 우산은 비를 맞고 들어온 사람이 있을 가능성을 암시한다.","topic":"L5 독해·추론"},{"no":10,"kind":"mc","pts":3,"stem":"다음 중 빈칸에 알맞은 것은? \"Who is ______, Jane or Sue?\"","opts":["old","older","oldest","the oldest","most old"],"correct":2,"explain":"Jane과 Sue 두 사람의 비교이므로 older.","topic":"L5 비교급 응용"},{"no":11,"kind":"mc","pts":4,"stem":"빈칸에 알맞은 것은? \"I want ______ less plastic.\"","opts":["use","to use","using","used","uses"],"correct":2,"explain":"want 뒤에서 목적어 역할을 하는 to부정사.","topic":"L6 to부정사"},{"no":12,"kind":"mc","pts":4,"stem":"다음 중 to부정사가 주어 역할을 하는 문장은?","opts":["I want to recycle.","To save water is important.","My plan is to walk to school.","She decided to help.","He needs to rest."],"correct":2,"explain":"To save water가 주어 역할.","topic":"L6 to부정사의 역할"},{"no":13,"kind":"mc","pts":4,"stem":"빈칸에 알맞은 것은? \"My dream is ______ the Earth.\"","opts":["protect","protects","protected","to protect","protecting to"],"correct":4,"explain":"be동사 뒤에서 보어 역할을 하는 to protect.","topic":"L6 to부정사 보어"},{"no":14,"kind":"mc","pts":4,"stem":"빈칸에 알맞은 것은? \"I think ______ we should use less water.\"","opts":["if","because","that","but","or"],"correct":3,"explain":"think의 목적어가 되는 절을 이끄는 접속사 that.","topic":"L6 접속사 that"},{"no":15,"kind":"mc","pts":4,"stem":"다음 중 접속사 that이 올바르게 사용된 문장은?","opts":["I know that the Earth needs our help.","I know that is the Earth needs help.","She thinks that to we recycle.","He said that to save water.","We believe that is important protect trees."],"correct":1,"explain":"that 뒤에 주어+동사를 갖춘 완전한 절이 이어진다.","topic":"L6 that절"},{"no":16,"kind":"mc","pts":4,"stem":"\"leftovers\"의 뜻으로 가장 적절한 것은?","opts":["남은 음식","재활용품 수거함","일회용 컵","쓰레기 트럭","유리병"],"correct":1,"explain":"leftovers는 먹고 남은 음식.","topic":"L6 핵심 어휘"},{"no":17,"kind":"mc","pts":4,"stem":"다음 대화에서 가장 자연스러운 대답은?\nA: \"Can you please turn off the lights?\"\nB: \"______\"","opts":["Sure, I will.","I am a light.","It is taller.","There are blue.","To lights is good."],"correct":1,"explain":"부탁에 대한 자연스러운 수락 표현이다.","topic":"L6 대화·요청"},{"no":18,"kind":"mc","pts":4,"stem":"다음 글의 주제로 가장 적절한 것은?\n\"We brought our own cups to the café. We also used cloth bags at the store. Small changes helped us make less trash.\"","opts":["Why cups are expensive","Simple ways to reduce waste","The history of cafés","How to buy plastic bags","A famous detective"],"correct":2,"explain":"개인컵과 장바구니 사용으로 쓰레기를 줄이는 생활습관을 다룬다.","topic":"L6 독해·주제"},{"no":19,"kind":"mc","pts":4,"stem":"다음 중 \"I believe that recycling matters.\"에서 that의 쓰임과 같은 것은?","opts":["That bag is mine.","Look at that!","She said that we can help.","I like that blue cup.","Is that your pen?"],"correct":3,"explain":"문장 안에 완전한 절을 이끄는 접속사 that은 ③.","topic":"L6 접속사 that 구별"},{"no":20,"kind":"mc","pts":4,"stem":"다음 문장에 가장 알맞은 것은? \"There ______ a bottle and two cups on the table.\"","opts":["are","is","have","am","be"],"correct":2,"explain":"There be 구문의 동사는 바로 뒤에 오는 명사 a bottle에 맞춘다.","topic":"L5·L6 통합 문법"},{"no":21,"kind":"essay","pts":6,"stem":"주어진 단어를 모두 사용하여 \"이 가방은 저 가방보다 무겁다.\"를 영어로 쓰시오. (this bag / heavy / than / that bag)","correct":"This bag is heavier than that bag.","rubric":"주어·동사 구성 2점, heavier 2점, than 비교대상 2점.","topic":"L5 비교급 쓰기"},{"no":22,"kind":"essay","pts":6,"stem":"다음 문장을 영어로 쓰시오. \"책상 위에 단서 세 개가 있다.\" (There로 시작, clue 사용)","correct":"There are three clues on the desk.","rubric":"There are 2점, three clues 2점, on the desk 2점.","topic":"L5 There are 쓰기"},{"no":23,"kind":"essay","pts":6,"stem":"주어진 단어를 바르게 배열하여 한 문장을 완성하시오. (to / wants / reduce / waste / Jina)","correct":"Jina wants to reduce waste.","rubric":"주어+동사 2점, to부정사 목적어 구성 2점, 어순·철자 2점.","topic":"L6 to부정사 쓰기"},{"no":24,"kind":"essay","pts":6,"stem":"다음 두 문장을 접속사 that을 사용해 한 문장으로 합치시오. \"I think. We can save energy.\"","correct":"I think that we can save energy.","rubric":"I think 2점, that 2점, 완전한 절 구성 2점.","topic":"L6 that절 쓰기"},{"no":25,"kind":"essay","pts":6,"stem":"빈칸에 필요한 말을 써서 대화를 완성하시오.\nA: \"Can you please ( ① ) off the water?\"\nB: \"Sure. I ( ② ).\"\n단, ①은 동사원형 한 단어, ②는 조동사 한 단어로 쓰시오.","correct":"① turn ② will","rubric":"각 빈칸 정답 3점.","topic":"L6 요청 표현"}]}]</script>
<script>
(()=>{'use strict';
const all=JSON.parse(document.getElementById('examdata').textContent);
const STORE='daesin2026_midterm_v3';
const ICONS={'수학':'∠','국어':'가','과학':'⚗','영어':'Aa'};
const root=document.getElementById('root');
let state,active=null,current=0,view='home',timerId=null,lastTick=0;
function blankState(){return {subjects:Object.fromEntries(all.map(s=>[s.id,{answers:Array(25).fill(null),flags:Array(25).fill(false),scores:Array(5).fill(null),submitted:false,elapsed:0}]))};}
function load(){try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&x.subjects&&all.every(s=>x.subjects[s.id]&&x.subjects[s.id].answers?.length===25))return x;}catch(e){}return blankState();}
state=load();
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
function esc(v){return String(v==null?'':v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
function subj(){return all.find(x=>x.id===active)}
function astate(){return state.subjects[active]}
function isDone(a){return a!=null&&String(a).trim().length>0}
function sumDone(s){return s.answers.filter(isDone).length}
function score(i){return i<10?3:i<20?4:6}
function mcGrade(s,subject){return subject.items.slice(0,20).reduce((n,q,i)=>n+(s.answers[i]===q.correct?q.pts:0),0)}
function fmt(secs){secs=Math.max(0,Math.floor(secs));return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null} if(lastTick&&active&&view==='test'){astate().elapsed+=Math.max(0,Math.floor((Date.now()-lastTick)/1000));save()}lastTick=0}
function startTimer(){stopTimer();lastTick=Date.now();timerId=setInterval(()=>{if(view!=='test')return;const delta=Math.floor((Date.now()-lastTick)/1000);if(delta>=1){astate().elapsed+=delta;lastTick+=delta*1000;save()}const el=document.getElementById('timer');if(el){const left=2700-astate().elapsed;el.textContent='⏱ '+(left>0?fmt(left):'시간 경과');el.classList.toggle('danger',left<300)}} ,1000)}
function goHome(){stopTimer();active=null;view='home';draw()}
function openSubject(id){stopTimer();active=id;current=0;view=state.subjects[id].submitted?'result':'test';draw()}
function pillStatus(s){if(s.submitted){const g=mcGrade(s,all.find(x=>x.id===active));return '채점 완료 · '+g+'/70점'}return sumDone(s)+'/25문항 응답';}
function drawHome(){const subs=all.map(s=>{const d=state.subjects[s.id],no=sumDone(d),done=d.submitted;return `<button class="subject" data-open="${s.id}"><span class="subicon">${ICONS[s.id]}</span><b>${s.id}</b><span class="scope">${esc(s.scope)}</span><div class="subfoot"><span>${done?'채점 결과 보기':(no?'이어 풀기':'시험 시작')}</span><span>${done?mcGrade(d,s)+'/70점':no+'/25문항'} →</span></div></button>`}).join('');return `<section class="intro"><div class="eyebrow">2026학년도 2학기 · 개인 연습용</div><h1>태블릿 실전 모의고사</h1><p class="lead">과목을 누르고 터치로 정답을 고르세요. 서술형은 직접 입력하고, 시험을 제출하면 객관식은 자동채점됩니다.</p></section><div class="subject-grid">${subs}</div><div class="panel bottom-section"><h2 style="font-size:17px;margin:0 0 10px">시험 방식</h2><p class="note">과목당 <b>25문항 · 100점</b> (객관식 20문항 70점 + 서술형 5문항 30점). 화면은 문항별로 넘어가며, 45분 타이머와 문항 이동 표가 있습니다. 4과목 총 100문항입니다.</p><div class="callout">중요: 학교의 실제 시험지나 공개 기출이 아닌 <b>비공식 창작 모의고사</b>입니다. 학교 평가계획 첨부 파일을 열람하지 못해 정확한 문항 수·배점은 확인되지 않았습니다.</div><h3 style="font-size:15px">학습기록 보관</h3><p class="note">입력한 답은 이 기기의 같은 브라우저 저장공간에 자동 저장됩니다. <b>기기가 바뀌면 답안이 자동 동기화되지 않습니다.</b> 백업 파일을 저장해 다른 기기에서 불러올 수 있습니다.</p><div class="tool-actions"><button class="btn" data-backup>답안 백업</button><button class="btn" data-import>백업 불러오기</button><button class="btn danger" data-clearall>전체 답안 초기화</button></div></div><div class="footer">학습용으로만 사용 · 인터넷 연결 없이도 실행되는 단일 HTML 파일</div>`}
function drawTest(){const s=subj(),d=astate(),q=s.items[current],answer=d.answers[current],n=sumDone(d),left=2700-d.elapsed,opts=q.kind==='mc'?`<div class="choices">${q.opts.map((o,i)=>`<button class="choice ${answer===i+1?'selected':''}" data-choice="${i+1}"><span class="circle">${'①②③④⑤'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`:`<label for="essay" class="note" style="display:block;margin:0 0 5px">서술형 답안 작성</label><textarea class="response" id="essay" placeholder="답안을 여기에 입력하세요. 풀이 과정이나 근거도 적어보세요.">${esc(answer||'')}</textarea><p class="entryhelp">서술형은 시험 제출 후 모범답안과 비교해 스스로 채점합니다.</p>`;
return `<div class="exam-head"><div><button class="btn ghost" data-home>← 과목 선택</button><h1>${s.id} <span class="muted" style="font-size:14px;font-weight:500">실전 모의고사</span></h1><div class="note">${esc(s.scope)}</div></div><div class="timer" id="timer">⏱ ${left>0?fmt(left):'시간 경과'}</div></div><div class="progress"><div style="width:${n/25*100}%"></div></div><div class="exam-small"><span>${n}/25문항 답변 완료</span><span>객관식 70점 · 서술형 30점</span></div><section class="panel" style="margin-top:18px"><div class="question-top"><span class="pill">${String(q.no).padStart(2,'0')} / 25문항　·　${q.pts}점</span><button class="mark ${d.flags[current]?'active':''}" data-flag>${d.flags[current]?'★ 체크됨':'☆ 나중에 확인'}</button></div><div class="q-stem">${esc(q.stem)}</div>${opts}<div class="question-foot"><button class="btn" data-prev ${current===0?'disabled':''}>← 이전</button><button class="btn primary" data-next>${current===24?'답안 전체 보기':'다음 문제 →'}</button></div></section><div class="pageDots">${s.items.map((x,i)=>`<button class="dot ${isDone(d.answers[i])?'done':''} ${current===i?'current':''} ${d.flags[i]?'flag':''}" data-jump="${i}" title="${i+1}번${d.flags[i]?' (체크됨)':''}">${i+1}</button>`).join('')}</div><div class="submitbox"><div class="desc">노란 테두리: 다시 확인할 문제 · 파란색: 답변한 문제</div><button class="btn primary" data-submit>시험 제출 및 채점</button></div><p class="footer">제출 전에는 정답·해설이 보이지 않습니다. 모든 답은 기기에 자동 저장됩니다.</p>`;}
function drawResult(){const s=subj(),d=astate(),mc=mcGrade(d,s),hasAll=d.scores.every(x=>x!==null),written=d.scores.reduce((a,b)=>a+(Number.isFinite(+b)&&b!=null?+b:0),0),ungraded=d.scores.filter(x=>x===null).length,unanswered=25-sumDone(d);let report=s.items.map((q,i)=>{let user=d.answers[i];if(q.kind==='mc'){let ok=user===q.correct;return `<div class="review-item"><span class="pill">${i+1}번 · ${q.pts}점 · ${esc(q.topic)}</span><h3>${esc(q.stem)}</h3><div class="answer-row ${ok?'correct':'wrong'}">${ok?'✓ 정답':'✕ '+(user==null?'미응답':'오답')} · 내 답: ${user? '①②③④⑤'[user-1]+' '+esc(q.opts[user-1]):'없음'} / 정답: ${'①②③④⑤'[q.correct-1]} ${esc(q.opts[q.correct-1])}</div><div class="essay-box">${esc(q.explain)}</div></div>`}
let score=d.scores[i-20];return `<div class="review-item"><span class="pill">${i+1}번 · 6점 · ${esc(q.topic)}</span><h3>${esc(q.stem)}</h3><div class="essay-box"><b>내가 쓴 답</b>\n${esc(user||'(작성하지 않음)')}</div><div class="essay-box"><b>모범답안</b>\n${esc(q.correct)}\n\n<b>채점 기준</b>\n${esc(q.rubric)}</div><label class="note" style="display:block;margin:12px 0 5px">모범답안과 비교한 점수 (0~6점)</label><select class="select-score" data-score="${i-20}"><option value="" ${score===null?'selected':''}>미채점</option>${[0,1,2,3,4,5,6].map(n=>`<option value="${n}" ${score===n?'selected':''}>${n}점</option>`).join('')}</select></div>`}).join('');return `<div class="exam-head"><div><button class="btn ghost" data-home>← 과목 선택</button><h1>${s.id} 시험 결과</h1><p class="note">객관식 자동채점 완료 · 서술형 5문항은 직접 채점</p></div></div><div class="result-cards"><div class="stat"><small>객관식 점수</small><strong>${mc}<span style="font-size:13px">/70</span></strong></div><div class="stat"><small>서술형 점수</small><strong>${written}<span style="font-size:13px">/30</span></strong></div><div class="stat"><small>총점</small><strong id="total">${hasAll?mc+written:'미확정'}${hasAll?'<span style="font-size:13px">/100</span>':''}</strong></div></div>${ungraded?`<div class="nudge">서술형 ${ungraded}문항의 점수를 정하면 총점이 표시됩니다. 미채점은 0점으로 간주하지 않습니다.</div>`:''}${unanswered?`<div class="nudge">미응답 문항 ${unanswered}개가 있습니다.</div>`:''}<div class="tool-actions" style="margin-bottom:20px"><button class="btn" data-summary>성적표 저장(.txt)</button><button class="btn" data-backup>전체 답안 백업</button><button class="btn danger" data-restart>이 과목 다시 풀기</button></div><section class="panel"><h2 style="margin:0 0 14px;font-size:20px">문항별 정답 및 해설</h2><div style="font-size:13px;color:var(--muted)">정답·풀이를 확인하고 오답의 개념을 복습하세요.</div>${report}</section><div class="footer">서술형은 예시답안이므로 취지가 같다면 다른 표현도 정답이 될 수 있습니다.</div>`;}
function draw(){root.innerHTML=view==='home'?drawHome():view==='test'?drawTest():drawResult();if(view==='test')startTimer();window.scrollTo({top:0,behavior:'instant'});}
function choice(i){astate().answers[current]=i;save();const area=root.querySelector('.choices');if(area){area.querySelectorAll('[data-choice]').forEach(b=>{let yes=Number(b.dataset.choice)===i;b.classList.toggle('selected',yes)});}updateMini()}
function updateMini(){let d=astate(),n=sumDone(d);const p=root.querySelector('.progress div');if(p)p.style.width=(n/25*100)+'%';const sm=root.querySelector('.exam-small span');if(sm)sm.textContent=n+'/25문항 답변 완료';let dots=root.querySelectorAll('[data-jump]');dots.forEach((e,i)=>e.classList.toggle('done',isDone(d.answers[i])))}
function nav(i){stopTimer();current=Math.max(0,Math.min(24,i));draw()}
function finish(){const d=astate(),n=sumDone(d);if(n<25&&!confirm(`아직 ${25-n}문항에 답하지 않았습니다. 제출할까요?`))return;if(!confirm('제출하면 정답과 해설이 공개됩니다. 시험을 제출하시겠습니까?'))return;stopTimer();d.submitted=true;save();view='result';draw()}
function download(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function report(){const d=astate(),s=subj(),g=mcGrade(d,s),hasAll=d.scores.every(x=>x!=null),essays=d.scores.reduce((p,v)=>p+(v==null?0:+v),0);let text=`부산대신중학교 중1 2학기 ${active} 모의고사 성적표\n`+`학습용 비공식 시험 / 생성일: ${new Date().toLocaleString('ko-KR')}\n`+`객관식: ${g}/70점\n서술형: ${hasAll?essays+'/30점':'미채점'}\n총점: ${hasAll?g+essays+'/100점':'미확정'}\n\n`;s.items.forEach((q,i)=>{text+=`${i+1}번 (${q.pts}점) ${q.topic}\n 내 답: ${d.answers[i]??'(미응답)'}\n ${q.kind==='mc'?'정답: '+q.correct:'채점: '+(d.scores[i-20]??'미채점')+'/6점'}\n`});download('대신중_중간고사_'+active+'_성적표.txt',text)}
function initBackup(){download('대신중_중간고사_답안백업.json',JSON.stringify({version:3,exportedAt:new Date().toISOString(),data:state},null,2),'application/json')}
function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result),x=d.data;if(!x||!x.subjects||!all.every(s=>x.subjects[s.id]&&x.subjects[s.id].answers.length===25))throw Error('파일 형식 불일치');if(confirm('현재 저장된 답안을 백업 내용으로 덮어쓸까요?')){stopTimer();state=x;save();goHome();alert('백업을 불러왔습니다.')}}catch(e){alert('백업 파일을 읽을 수 없습니다.')}};reader.readAsText(file)}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const z=b.dataset;if(z.home!==undefined){goHome();return}if(z.open){openSubject(z.open);return}if(z.choice){choice(Number(z.choice));return}if(z.next!==undefined){if(current===24){nav(24);root.querySelector('[data-submit]')?.scrollIntoView({behavior:'smooth',block:'center'})}else nav(current+1);return}if(z.prev!==undefined){nav(current-1);return}if(z.jump!==undefined){nav(Number(z.jump));return}if(z.flag!==undefined){let d=astate();d.flags[current]=!d.flags[current];save();b.classList.toggle('active');b.textContent=d.flags[current]?'★ 체크됨':'☆ 나중에 확인';const dot=root.querySelector(`[data-jump="${current}"]`);if(dot)dot.classList.toggle('flag',d.flags[current]);return}if(z.submit!==undefined){finish();return}if(z.backup!==undefined){initBackup();return}if(z.summary!==undefined){report();return}if(z.import!==undefined){document.getElementById('fileinput').click();return}if(z.clearall!==undefined){if(confirm('4과목의 모든 답안을 삭제할까요? 복구하려면 먼저 백업하세요.')){state=blankState();save();goHome()}return}if(z.restart!==undefined){if(confirm(`${active}의 기존 답안과 점수를 지우고 다시 풀까요?`)){stopTimer();state.subjects[active]=blankState().subjects[active];save();view='test';current=0;draw()}return}});
root.addEventListener('input',e=>{if(e.target.id==='essay'){astate().answers[current]=e.target.value;save();updateMini()}});
root.addEventListener('change',e=>{if(e.target.dataset.score!==undefined){let i=Number(e.target.dataset.score);astate().scores[i]=e.target.value===''?null:Number(e.target.value);save();let prevY=window.scrollY;root.innerHTML=drawResult();window.scrollTo(0,prevY)}});
const fileinput=document.createElement('input');fileinput.type='file';fileinput.accept='.json,application/json';fileinput.id='fileinput';fileinput.classList.add('hidden');fileinput.addEventListener('change',()=>importBackup(fileinput.files?.[0]));document.body.appendChild(fileinput);
document.getElementById('homeBtn').addEventListener('click',goHome);
window.addEventListener('beforeunload',()=>{if(lastTick&&active&&view==='test'){astate().elapsed+=Math.floor((Date.now()-lastTick)/1000);save()}});
draw();
})();
</script></body></html>
