\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\" fill=\"#244366\">반지름 5cm<\/text><text x=\"354\" y=\"56\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\" fill=\"#244366\">반지름 4cm<\/text><\/g><\/svg>"},{"no":18,"kind":"mc","pts":4,"stem":"다각형의 모든 외각을 같은 방향으로 한 개씩 택하여 더한 값은?","opts":["90°","180°","270°","360°","꼭짓점 수에 따라 다르다"],"correct":4,"explain":"볼록다각형에서 한 꼭짓점마다 같은 방향으로 취한 외각의 합은 360°.","topic":"외각의 합","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 225\" role=\"img\" aria-label=\"볼록오각형의 바깥각을 각 꼭짓점에서 한 개씩 취하는 경우\"><defs><marker id=\"ar18\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 Z\" fill=\"#315caa\"/><\/marker><\/defs><rect x=\"1\" y=\"1\" width=\"458\" height=\"223\" rx=\"15\" fill=\"#fff\"/><g font-family=\"system-ui,Apple SD Gothic Neo,sans-serif\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"230,32 310,90 279,184 181,184 150,90\" fill=\"#f0f5ff\" stroke=\"#315caa\" stroke-width=\"3\"/><text x=\"233\" y=\"209\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"650\" fill=\"#244366\">각 꼭짓점의 외각을 1개씩<\/text><\/g><\/svg>"},{"no":19,"kind":"mc","pts":4,"stem":"한 다각형의 한 꼭짓점에서 그을 수 있는 대각선이 6개이다. 이 다각형의 내각의 크기의 합은?","opts":["1,080°","1,260°","1,440°","1,620°","1,800°"],"correct":2,"explain":"한 꼭짓점에서 대각선은 n−3개. n−3=6이므로 n=9이고, 내각의 합은 (9−2)×180°=1,260°.","topic":"다각형 대각선·내각의 합 2단계 응용"},{"no":20,"kind":"mc","pts":4,"stem":"어떤 다각형의 대각선이 모두 35개이다. 이 다각형의 한 꼭짓점에서 그을 수 있는 대각선의 개수는?","opts":["5개","6개","7개","8개","9개"],"correct":3,"explain":"n(n−3)/2=35를 만족하는 변의 개수는 n=10이다. 따라서 한 꼭짓점에서 그을 수 있는 대각선은 n−3=7개.","topic":"대각선의 개수 역산"},{"no":21,"kind":"essay","pts":6,"stem":"한 직선 위에 서로 다른 점 A, B, C, D가 이 순서대로 있다. 두 점을 끝점으로 하는 서로 다른 선분을 모두 쓰고, 그 개수를 구하시오.","correct":"AB, AC, AD, BC, BD, CD: 6개","rubric":"서로 다른 선분 6개 전부 4점, 개수 2점.","topic":"선분 개수","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 225\" role=\"img\" aria-label=\"한 직선 위에 A B C D 순서로 배열된 네 점\"><defs><marker id=\"ar19\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 Z\" fill=\"#315caa\"/><\/marker><\/defs><rect x=\"1\" y=\"1\" width=\"458\" height=\"223\" rx=\"15\" fill=\"#fff\"/><g font-family=\"system-ui,Apple SD Gothic Neo,sans-serif\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"58\" y1=\"126\" x2=\"398\" y2=\"126\" stroke=\"#33567c\" stroke-width=\"3\" /><circle cx=\"105\" cy=\"126\" r=\"5\" fill=\"#315caa\"/><text x=\"105\" y=\"158\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"650\" fill=\"#244366\">A<\/text><circle cx=\"185\" cy=\"126\" r=\"5\" fill=\"#315caa\"/><text x=\"185\" y=\"158\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"650\" fill=\"#244366\">B<\/text><circle cx=\"275\" cy=\"126\" r=\"5\" fill=\"#315caa\"/><text x=\"275\" y=\"158\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"650\" fill=\"#244366\">C<\/text><circle cx=\"355\" cy=\"126\" r=\"5\" fill=\"#315caa\"/><text x=\"355\" y=\"158\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"650\" fill=\"#244366\">D<\/text><\/g><\/svg>"},{"no":22,"kind":"essay","pts":6,"stem":"한 삼각형에서 두 내각이 (2x+10)°, (x+20)°이고 나머지 한 내각이 60°이다. x의 값을 풀이 과정과 함께 구하시오.","correct":"(2x+10)+(x+20)+60=180 → 3x=90 → x=30","rubric":"식 세우기 3점, 계산 및 x=30 3점.","topic":"삼각형 내각","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 225\" role=\"img\" aria-label=\"삼각형 내각 세 개를 2x+10도 x+20도 60도로 표시한 그림\"><defs><marker id=\"ar20\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 Z\" fill=\"#315caa\"/><\/marker><\/defs><rect x=\"1\" y=\"1\" width=\"458\" height=\"223\" rx=\"15\" fill=\"#fff\"/><g font-family=\"system-ui,Apple SD Gothic Neo,sans-serif\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"120,195 330,195 184,25\" fill=\"#f0f5ff\" stroke=\"#315caa\" stroke-width=\"3\"/><text x=\"113\" y=\"162\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"650\" fill=\"#244366\">(2x+10)°<\/text><text x=\"341\" y=\"162\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"650\" fill=\"#244366\">(x+20)°<\/text><text x=\"183\" y=\"71\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"650\" fill=\"#b85043\">60°<\/text><\/g><\/svg>"},{"no":23,"kind":"essay","pts":6,"stem":"내각의 크기의 합이 900°인 다각형에 대하여 (가) 변의 개수 (나) 대각선의 총개수를 차례로 구하시오.","correct":"(n−2)×180=900 → n=7; 대각선 7×4÷2=14개","rubric":"변의 개수 3점, 대각선 개수 3점.","topic":"다각형 종합"},{"no":24,"kind":"essay","pts":6,"stem":"어떤 정다각형의 한 내각이 150°이다. 한 외각의 크기와 변의 개수를 각각 구하고 계산 근거를 쓰시오.","correct":"한 외각 180−150=30°; 변의 개수 360÷30=12개","rubric":"외각 도출 3점, 변의 개수 및 근거 3점.","topic":"정다각형 종합"},{"no":25,"kind":"essay","pts":6,"stem":"내각의 크기가 모두 같은 볼록오각형이 있다. 그 오각형의 한 내각과 한 외각의 크기를 각각 구하고 풀이를 쓰시오.","correct":"한 내각 (5−2)×180÷5=108°, 한 외각 180−108=72°","rubric":"내각 3점, 외각 3점.","topic":"다각형 각도","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 225\" role=\"img\" aria-label=\"내각이 모두 같은 볼록오각형\"><defs><marker id=\"ar21\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 Z\" fill=\"#315caa\"/><\/marker><\/defs><rect x=\"1\" y=\"1\" width=\"458\" height=\"223\" rx=\"15\" fill=\"#fff\"/><g font-family=\"system-ui,Apple SD Gothic Neo,sans-serif\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"230,31 313,91 281,188 179,188 147,91\" fill=\"#f0f5ff\" stroke=\"#315caa\" stroke-width=\"3\"/><text x=\"230\" y=\"212\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"650\" fill=\"#244366\">다섯 내각이 모두 같음<\/text><\/g><\/svg>"}]},{"id":"국어","scope":"창비 1-2: 1-(1)~(2), 「하늘은 맑건만」, 4-(1)~(2)","items":[{"no":1,"kind":"mc","pts":3,"stem":"다음 대화를 듣고 가장 타당하게 추론할 수 있는 것은?\n가: \"비가 그쳤네. 그런데 바닥이 반짝거려.\" 나: \"우산은 접어도 되겠다.\"","opts":["밤이 되었다.","바닥이 아직 젖어 있을 가능성이 있다.","두 사람은 실내에 있다.","우산은 고장 났다.","어제는 눈이 왔다."],"correct":2,"explain":"\"비가 그쳤다\"와 \"바닥이 반짝\"이라는 단서에서 바닥이 젖었음을 추론할 수 있다.","topic":"1-(1) 추론하며 듣기"},{"no":2,"kind":"mc","pts":3,"stem":"대화 내용에 드러나지 않은 정보를 추론할 때 가장 적절한 방법은?","opts":["화자의 말투나 상황을 무시한다.","자신의 편견을 사실로 단정한다.","말과 상황에 나타난 단서를 함께 고려한다.","첫 문장만 듣고 결론 내린다.","반드시 문자 그대로만 해석한다."],"correct":3,"explain":"언어적·비언어적 단서와 맥락을 함께 고려해야 한다.","topic":"1-(1) 추론하며 듣기"},{"no":3,"kind":"mc","pts":3,"stem":"\"괜찮아.\"라는 말의 숨은 뜻을 추론하는 데 가장 도움이 되는 자료는?","opts":["말하는 사람의 목소리와 표정","대화 장소의 건물 높이","달력의 글씨체","대화문 줄 수","말하는 사람의 키"],"correct":1,"explain":"같은 말이라도 억양·표정·상황에 따라 의미가 달라진다.","topic":"1-(1) 말의 숨은 뜻"},{"no":4,"kind":"mc","pts":3,"stem":"윗글을 읽고 지현에 관해 추론한 내용으로 가장 타당한 것은?","opts":["반대표로 출전하기로 이미 결정했다.","체육대회에 전혀 관심이 없다.","참가 여부를 신중히 고민하고 있을 수 있다.","체육대회는 취소되었다.","지현은 신청서를 제출했다."],"correct":3,"explain":"신청서의 참가 칸이 비어 있고 운동장을 오래 바라보다 선생님을 찾아간 행동으로부터 참가를 고민한다고 추론할 수 있다.","topic":"글의 단서로 추론","passage":"지현은 체육대회 참가 신청서를 하루 종일 가방에 넣어 두었다. 친구들이 계주 연습을 시작하자 지현은 복도 창가에서 운동장을 바라보았다. 지난봄 발목을 다친 뒤로는 달리기를 거의 하지 않았다. 오늘도 신청서의 참가 칸은 비어 있었다. 지현은 종이 끝을 만지작거리다가 조용히 체육 선생님을 찾아갔다."},{"no":5,"kind":"mc","pts":3,"stem":"추론하며 읽기의 올바른 설명은?","opts":["글에 없는 정보를 근거 없이 만들어 내는 것이다.","글에 명시된 내용과 배경지식을 연결하여 의미를 짐작하는 것이다.","어휘를 사전 뜻대로만 해석하는 것이다.","필자의 주장에 무조건 동의하는 것이다.","글의 첫째 문장만 보는 것이다."],"correct":2,"explain":"글의 단서와 관련 배경지식에 기반해 추론한다.","topic":"1-(2) 추론하며 읽기"},{"no":6,"kind":"mc","pts":3,"stem":"\"그는 숙제를 다 했다는 친구의 말에 노트를 슬쩍 바라보았다.\"의 행동에 대한 추론으로 가장 타당한 것은?","opts":["친구의 말을 확인하려는 마음이 있을 수 있다.","친구에게 무조건 화를 내고 있다.","노트를 잃어버렸다.","곧바로 집에 가려고 한다.","친구의 말을 믿는다는 사실이 확정된다."],"correct":1,"explain":"\"노트를 바라봄\"은 사실 확인 욕구를 시사하지만 확정할 수는 없다.","topic":"1-(2) 행동 추론"},{"no":7,"kind":"mc","pts":3,"stem":"글을 읽고 추론한 내용이 적절한지 점검하는 기준으로 가장 적절한 것은?","opts":["내 취향에 맞는가?","친구들도 같은 답을 선택했는가?","글 속 단서로 뒷받침되는가?","문장이 길게 쓰였는가?","낯선 낱말이 많은가?"],"correct":3,"explain":"합리적인 추론은 텍스트의 근거로 검증할 수 있어야 한다.","topic":"1단원 추론 근거"},{"no":8,"kind":"mc","pts":3,"stem":"현덕의 「하늘은 맑건만」에서 문기가 겪는 핵심 내적 갈등은?","opts":["공부와 운동 중 무엇을 선택할 것인가","잘못을 숨기려는 마음과 양심에 따라 고백하려는 마음의 충돌","전학과 유학 중 선택","운동회 참가 여부","새 옷을 살지 말지 고민"],"correct":2,"explain":"문기는 잘못한 일에 대한 죄책감과 이를 바로잡으려는 양심 사이에서 갈등한다.","topic":"「하늘은 맑건만」 갈등","passage":"「하늘은 맑건만」의 상황 요약(작품 원문이 아님): 문기는 심부름 중 거스름돈과 관련된 잘못을 저지르고, 자신의 행동을 감추려는 마음과 잘못을 바로잡아야 한다는 양심 사이에서 괴로워한다. 수만과 얽힌 상황은 문기의 갈등을 더욱 깊게 만든다. 밖의 맑은 하늘과 달리 문기의 마음은 편하지 않다."},{"no":9,"kind":"mc","pts":3,"stem":"「하늘은 맑건만」의 인물과 내적 갈등의 관계를 이해한 것으로 가장 적절한 것은?","opts":["문기의 갈등은 전적으로 날씨 때문에 생긴다.","문기는 자신의 잘못을 숨기려는 마음과 양심 사이에서 갈등한다.","수만은 작품에 등장하지 않는다.","문기는 처음부터 끝까지 죄책감을 느끼지 않는다.","작품의 갈등은 단지 경기에서 지는 문제이다."],"correct":2,"explain":"문기의 핵심 내적 갈등은 잘못을 숨기려는 마음과 정직하게 바로잡으려는 양심의 충돌이다.","topic":"작품 속 인물의 내적 갈등","passage":"「하늘은 맑건만」의 상황 요약(작품 원문이 아님): 문기는 심부름 중 거스름돈과 관련된 잘못을 저지르고, 자신의 행동을 감추려는 마음과 잘못을 바로잡아야 한다는 양심 사이에서 괴로워한다. 수만과 얽힌 상황은 문기의 갈등을 더욱 깊게 만든다. 밖의 맑은 하늘과 달리 문기의 마음은 편하지 않다."},{"no":10,"kind":"mc","pts":3,"stem":"「하늘은 맑건만」에서 문기를 괴롭히는 죄책감의 출발점과 가장 관련 깊은 사건은?","opts":["시험 중 부정행위","고깃간 거스름돈과 관련된 잘못","운동장에서 다툼","책을 잃어버린 일","지각을 한 일"],"correct":2,"explain":"고깃간 심부름에서 거스름돈과 관련된 잘못이 중요한 계기이다.","topic":"「하늘은 맑건만」 사건"},{"no":11,"kind":"mc","pts":4,"stem":"「하늘은 맑건만」에서 수만의 역할에 대한 설명으로 가장 적절한 것은?","opts":["문기의 양심적 결단을 돕는 담임 교사이다.","문기와 관련된 잘못을 둘러싼 갈등을 심화하는 인물이다.","가게 주인이다.","문기의 동생이다.","사건과 아무 관련이 없는 행인이다."],"correct":2,"explain":"수만은 문기의 잘못과 그 뒤의 갈등을 심화시키는 인물이다.","topic":"「하늘은 맑건만」 인물 관계","passage":"「하늘은 맑건만」의 상황 요약(작품 원문이 아님): 문기는 심부름 중 거스름돈과 관련된 잘못을 저지르고, 자신의 행동을 감추려는 마음과 잘못을 바로잡아야 한다는 양심 사이에서 괴로워한다. 수만과 얽힌 상황은 문기의 갈등을 더욱 깊게 만든다. 밖의 맑은 하늘과 달리 문기의 마음은 편하지 않다."},{"no":12,"kind":"mc","pts":4,"stem":"작품 제목 「하늘은 맑건만」과 문기의 마음을 연결한 설명으로 가장 적절한 것은?","opts":["맑은 하늘은 문기의 양심의 고통과 대비된다.","맑은 하늘은 시험 범위를 뜻한다.","맑은 하늘은 실내 배경을 뜻한다.","날씨와 심리는 언제나 일치한다.","문기의 마음도 처음부터 끝까지 평온하다."],"correct":1,"explain":"맑은 하늘이라는 외부 풍경은 죄책감으로 어두운 문기의 내면과 대비된다.","topic":"「하늘은 맑건만」 제목","passage":"「하늘은 맑건만」의 상황 요약(작품 원문이 아님): 문기는 심부름 중 거스름돈과 관련된 잘못을 저지르고, 자신의 행동을 감추려는 마음과 잘못을 바로잡아야 한다는 양심 사이에서 괴로워한다. 수만과 얽힌 상황은 문기의 갈등을 더욱 깊게 만든다. 밖의 맑은 하늘과 달리 문기의 마음은 편하지 않다."},{"no":13,"kind":"mc","pts":4,"stem":"「하늘은 맑건만」의 중심 주제로 가장 적절한 것은?","opts":["친구와의 경쟁에서 승리하기","가난한 사람은 언제나 죄가 있다는 것","잘못을 돌아보고 양심과 정직함을 지키는 삶","도시 생활의 편리함","과학 기술의 발전"],"correct":3,"explain":"잘못을 반성하고 정직한 삶을 추구하는 성장의 의미가 핵심이다.","topic":"「하늘은 맑건만」 주제"},{"no":14,"kind":"mc","pts":4,"stem":"다음 자료를 활용하여 '학교 복도에 정수기를 더 설치해야 한다.'는 주장을 뒷받침하려 한다. 자료를 더 신뢰할 수 있게 만들기 위해 필요한 근거는?","opts":["나는 파란색을 좋아한다.","실제 쉬는 시간에 대기하는 학생 수와 평균 대기 시간 조사","우리 반은 운동을 잘한다.","정수기는 멋있게 생겼다.","친구가 그냥 좋다고 했다."],"correct":2,"explain":"대기 학생 수와 평균 대기 시간 등을 실제로 조사하여 자료의 출처·조사 방법·표본을 제시해야 주장에 설득력이 생긴다.","topic":"4-(1) 근거를 들어 글 쓰기","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 225\" role=\"img\" aria-label=\"정수기 1대일 때 평균 대기 4분, 두 대일 때 평균 대기 2분이라는 예시 관찰 결과\"><defs><marker id=\"ar35\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 Z\" fill=\"#315caa\"/><\/marker><\/defs><rect x=\"1\" y=\"1\" width=\"458\" height=\"223\" rx=\"15\" fill=\"#fff\"/><g font-family=\"system-ui,Apple SD Gothic Neo,sans-serif\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><text x=\"230\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"650\" fill=\"#244366\">쉬는 시간 정수기 이용 관찰 결과(예시)<\/text><rect x=\"60\" y=\"53\" width=\"340\" height=\"135\" rx=\"8\" fill=\"#fafcff\" stroke=\"#b8c9e4\" stroke-width=\"1.6\"/><text x=\"86\" y=\"91\" text-anchor=\"start\" font-size=\"14\" font-weight=\"650\" fill=\"#244366\">1대일 때<\/text><rect x=\"169\" y=\"71\" width=\"188\" height=\"22\" rx=\"8\" fill=\"#3c6ab5\" stroke=\"#3c6ab5\" stroke-width=\"1.6\"/><text x=\"365\" y=\"89\" text-anchor=\"start\" font-size=\"13\" font-weight=\"650\" fill=\"#244366\">평균 4분<\/text><text x=\"86\" y=\"138\" text-anchor=\"start\" font-size=\"14\" font-weight=\"650\" fill=\"#244366\">2대일 때<\/text><rect x=\"169\" y=\"118\" width=\"94\" height=\"22\" rx=\"8\" fill=\"#5ca89d\" stroke=\"#5ca89d\" stroke-width=\"1.6\"/><text x=\"267\" y=\"136\" text-anchor=\"start\" font-size=\"13\" font-weight=\"650\" fill=\"#244366\">평균 2분<\/text><text x=\"230\" y=\"209\" .","안전은 중요하지 않다.","공부는 어렵다."],"correct":2,"explain":"현실적인 비용 문제를 고려한 반론을 예상해 설득력을 높인다.","topic":"4-(1) 반론 고려"},{"no":18,"kind":"mc","pts":4,"stem":"개인 인터넷 방송을 비판적으로 시청하는 태도로 옳은 것은?","opts":["조회수가 높으면 무조건 사실로 믿는다.","광고·협찬 표시와 정보의 출처를 확인한다.","자극적인 제목은 언제나 정확하다.","댓글 수가 많으면 실험 없이 믿는다.","진행자의 말은 검증할 필요가 없다."],"correct":2,"explain":"정보의 신뢰성과 상업적 의도 및 편집 효과를 점검해야 한다.","topic":"4-(2) 매체 읽기","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 225\" role=\"img\" aria-label=\"광고 여부가 불분명한 조회수 높은 개인 방송의 가상 화면\"><defs><marker id=\"ar37\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 Z\" fill=\"#315caa\"/><\/marker><\/defs><rect x=\"1\" y=\"1\" width=\"458\" height=\"223\" rx=\"15\" fill=\"#fff\"/><g font-family=\"system-ui,Apple SD Gothic Neo,sans-serif\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"80\" y=\"34\" width=\"300\" height=\"157\" rx=\"8\" fill=\"#f0f4fa\" stroke=\"#b0c2dc\" stroke-width=\"1.6\"/><rect x=\"96\" y=\"49\" width=\"88\" height=\"26\" rx=\"8\" fill=\"#fbdbda\" stroke=\"#dea4a0\" stroke-width=\"1.6\"/><text x=\"140\" y=\"67\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\" fill=\"#aa5148\">광고?<\/text><text x=\"231\" y=\"104\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"650\" fill=\"#244366\">영상 속 주장<\/text><text x=\"230\" y=\"144\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"650\" fill=\"#b85043\">조회수 10만 ≠ 사실 검증<\/text><\/g><\/svg>"},{"no":19,"kind":"mc","pts":4,"stem":"대중 매체와 개인 인터넷 방송의 특성에 대한 설명으로 가장 적절한 것은?","opts":["모든 매체는 정보 전달 방식과 제작 환경이 동일하다.","개인 인터넷 방송은 시청자와 실시간 소통할 수 있는 경우가 있다.","개인 방송에서는 광고가 금지된다.","방송 화면에 나온 정보는 항상 사실이다.","대중 매체는 의견을 전할 수 없다."],"correct":2,"explain":"개인 인터넷 방송은 댓글·채팅 등 실시간 상호작용이 가능할 수 있다.","topic":"4-(2) 매체 특성"},{"no":20,"kind":"mc","pts":4,"stem":"영상에서 한 사람의 발언 중 일부만 잘라 보여 주었다. 가장 적절한 반응은?","opts":["그 영상만으로 발언의 전체 의도를 확정한다.","조회수가 높으면 그대로 전파한다.","전후 맥락과 원본 내용을 살펴본다.","단어 하나만으로 인물을 평가한다.","편집은 의미에 영향을 주지 않는다."],"correct":3,"explain":"편집된 영상은 맥락이 빠질 수 있으므로 전체 내용을 확인해야 한다.","topic":"4-(2) 영상 편집","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 225\" role=\"img\" aria-label=\"원본 발언의 뒤쪽을 잘라 의미가 달라진 편집 화면\"><defs><marker id=\"ar38\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 Z\" fill=\"#315caa\"/><\/marker><\/defs><rect x=\"1\" y=\"1\" width=\"458\" height=\"223\" rx=\"15\" fill=\"#fff\"/><g font-family=\"system-ui,Apple SD Gothic Neo,sans-serif\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"39\" y=\"37\" width=\"382\" height=\"152\" rx=\"8\" fill=\"#f2f6fd\" stroke=\"#b9c9de\" stroke-width=\"1.6\"/><text x=\"65\" y=\"72\" text-anchor=\"start\" font-size=\"14\" font-weight=\"650\" fill=\"#436184\">원본 발언<\/text><text x=\"65\" y=\"97\" text-anchor=\"start\" font-size=\"16\" font-weight=\"650\" fill=\"#244366\">“그 방법은 좋아 보이지만 안전하지 않다.”<\/text><line x1=\"55\" y1=\"113\" x2=\"403\" y2=\"113\" stroke=\"#d9e2ed\" stroke-width=\"1.4\" /><text x=\"65\" y=\"140\" text-anchor=\"start\" font-size=\"14\" font-weight=\"650\" fill=\"#bf554a\">편집된 화면<\/text><text x=\"65\" y=\"166\" text-anchor=\"start\" font-size=\"16\" font-weight=\"650\" fill=\"#244366\">“그 방법은 좋아 보이지만…”<\/text><\/g><\/svg>"},{"no":21,"kind":"essay","pts":6,"stem":"\"민지는 점심시간에 급식실 앞을 서성이다가 가방에서 도시락을 꺼냈다.\"라는 문장을 읽고, 민지의 상황을 하나 추론하고 글 속 단서 두 가지를 쓰시오.","correct":"예: 민지는 급식을 먹지 않을 생각일 수 있다. 단서: 급식실 앞을 서성임 / 도시락을 꺼냄.","rubric":"추론의 타당성 2점, 단서 2개 각 2점. 확정할 수 없는 내용을 단정하면 감점.","topic":"1단원 추론"},{"no":22,"kind":"essay","pts":6,"stem":"「하늘은 맑건만」에서 문기가 느끼는 죄책감을 발생시킨 사건과, 그로 인해 생긴 내적 갈등을 각각 한 문장으로 쓰시오.","correct":"거스름돈과 관련해 잘못된 행동을 한 일이 죄책감의 계기다. 그 잘못을 숨기고 싶은 마음과 고백하고 바로잡고 싶은 양심이 충돌한다.","rubric":"사건 3점, 내적 갈등 3점.","topic":"「하늘은 맑건만」 갈등"},{"no":23,"kind":"essay","pts":6,"stem":"\"학교에 자전거 보관대를 늘려야 한다.\"는 주장에 활용할 수 있는 객관적 근거 한 가지와, 그 근거를 확인할 조사 방법 한 가지를 쓰시오.","correct":"예: 현재 보관대가 부족해 자전거를 통로에 세우는 학생이 많다. 등교 시간대 보관대 이용 대수와 통로 주차 대수를 조사한다.","rubric":"관련 근거 3점, 검증 가능한 조사 방법 3점.","topic":"4-(1) 논증"},{"no":24,"kind":"essay","pts":6,"stem":"\"어떤 음식만 먹으면 시험 성적이 무조건 오른다\"는 개인 방송의 주장에 대하여 확인해야 할 사항 세 가지를 쓰시오.","correct":"예: 근거 연구의 존재, 광고·협찬 여부, 주장에 과장이 있는지(표본·조건·출처 포함).","rubric":"신뢰성 확인 항목 3개 각 2점.","topic":"4-(2) 미디어 리터러시"},{"no":25,"kind":"essay","pts":6,"stem":"추론하며 읽기와 근거를 들어 글 쓰기의 공통점을 \"근거\"라는 단어를 반드시 포함하여 두 문장 이내로 설명하시오.","correct":"추론하며 읽기는 글 속 근거를 활용하여 숨은 뜻을 짐작한다. 근거를 들어 글 쓰기는 주장을 믿을 만하게 뒷받침하는 근거를 제시한다.","rubric":"읽기 활동과 근거 관계 3점, 쓰기 활동과 근거 관계 3점.","topic":"통합 서술"}]},{"id":"과학","scope":"힘의 작용 / 열","items":[{"no":1,"kind":"mc","pts":3,"stem":"힘이 작용한 결과로 보기 어려운 것은?","opts":["공을 차면 공의 속력이 변한다.","고무줄을 잡아당기면 늘어난다.","달리는 자전거가 방향을 바꾼다.","가만히 있는 돌이 아무 원인 없이 스스로 위로 솟는다.","말랑한 공을 누르면 모양이 변한다."],"correct":4,"explain":"힘은 물체의 모양이나 운동 상태를 바꿀 수 있다.","topic":"힘의 작용"},{"no":2,"kind":"mc","pts":3,"stem":"힘의 크기를 나타내는 단위는?","opts":["m","kg","N","℃","s"],"correct":3,"explain":"힘의 국제단위는 N(뉴턴)이다.","topic":"힘의 단위"},{"no":3,"kind":"mc","pts":3,"stem":"용수철 저울을 이용하여 직접 측정하는 물리량은?","opts":["질량","힘의 크기","부피","밀도","온도"],"correct":2,"explain":"용수철 저울은 힘(무게)의 크기를 측정한다.","topic":"힘의 측정"},{"no":4,"kind":"mc","pts":3,"stem":"지표면 부근에서 물체에 작용하는 중력의 방향은?","opts":["언제나 동쪽","언제나 서쪽","지구 중심 방향","물체의 이동 방향","지면과 나란한 방향"],"correct":3,"explain":"중력은 지구 중심을 향해 작용한다.","topic":"중력"},{"no":5,"kind":"mc","pts":3,"stem":"같은 장소에서 질량이 2 kg인 물체의 무게가 20 N일 때, 질량 5 kg인 물체의 무게는?","opts":["10 N","25 N","40 N","50 N","100 N"],"correct":4,"explain":"같은 장소에서는 무게가 질량에 비례한다. 20÷2×5=50 N.","topic":"중력 계산","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 225\" role=\"img\" aria-label=\"동일한 장소에서 2킬로그램은 20뉴턴, 5킬로그램은 미지의 무게\"><defs><marker id=\"ar22\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 Z\" fill=\"#315caa\"/><\/marker><\/defs><rect x=\"1\" y=\"1\" width=\"458\" height=\"223\" rx=\"15\" fill=\"#fff\"/><g font-family=\"system-ui,Apple SD Gothic Neo,sans-serif\" stroke-linecap=\"round 7=70 N.","rubric":"비례 관계 2점, 계산식 2점, 답과 단위 2점.","topic":"중력 계산"},{"no":22,"kind":"essay","pts":6,"stem":"공기 중 용수철 저울 눈금이 18 N인 물체를 물에 완전히 잠기게 했더니 12 N을 가리켰다. 부력의 크기와 방향을 쓰고 계산 과정을 나타내시오.","correct":"부력=18−12=6 N, 방향은 위쪽.","rubric":"뺄셈 및 부력 크기 4점, 방향 2점.","topic":"부력 실험","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 225\" role=\"img\" aria-label=\"공기 중 용수철 저울 18뉴턴, 물속 저울 12뉴턴\"><defs><marker id=\"ar33\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 Z\" fill=\"#315caa\"/><\/marker><\/defs><rect x=\"1\" y=\"1\" width=\"458\" height=\"223\" rx=\"15\" fill=\"#fff\"/><g font-family=\"system-ui,Apple SD Gothic Neo,sans-serif\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"53\" y=\"60\" width=\"146\" height=\"126\" rx=\"8\" fill=\"#f4f7fb\" stroke=\"#b8c9e4\" stroke-width=\"1.6\"/><rect x=\"255\" y=\"60\" width=\"149\" height=\"126\" rx=\"8\" fill=\"#e7f8ff\" stroke=\"#83c5db\" stroke-width=\"1.6\"/><text x=\"127\" y=\"99\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"650\" fill=\"#244366\">공기 중<\/text><text x=\"127\" y=\"148\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"650\" fill=\"#b85043\">18 N<\/text><text x=\"330\" y=\"99\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"650\" fill=\"#244366\">물속<\/text><text x=\"330\" y=\"148\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"650\" fill=\"#315caa\">12 N<\/text><text x=\"226\" y=\"144\" text-anchor=\"middle\" font-size=\"31\" font-weight=\"650\" fill=\"#244366\">→<\/text><\/g><\/svg>"},{"no":23,"kind":"essay","pts":6,"stem":"20℃ 물체와 60℃ 물체를 외부와 열교환이 없는 상태에서 접촉시켰다. 열의 이동 방향과 열평형의 뜻을 서술하시오.","correct":"60℃ 물체에서 20℃ 물체로 열이 이동한다. 열평형은 두 물체의 온도가 같아져 순열 이동이 없는 상태다.","rubric":"방향 2점, 열평형 상태·온도 같음 4점.","topic":"열평형","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 225\" role=\"img\" aria-label=\"20도와 60도 물체 사이에서 높은 온도에서 낮은 온도로 이동하는 열\"><defs><marker id=\"ar34\" markerWidth=\"9\" markerH -width=\"2\" rx=\"8\"/><text x=\"330\" y=\"91\" font-size=\"13\" text-anchor=\"middle\" fill=\"#294c75\">CLUE 3<\/text><circle cx=\"324\" cy=\"111\" r=\"9\" stroke=\"#6285b0\" stroke-width=\"2.5\" fill=\"none\"/><path d=\"M331 118 l10 11\" stroke=\"#6285b0\" stroke-width=\"3\"/><text x=\"230\" y=\"187\" text-anchor=\"middle\" font-size=\"15\" fill=\"#345477\">Three clues on the desk<\/text><\/svg>"},{"no":6,"kind":"mc","pts":3,"stem":"다음 중 문법적으로 옳은 문장은?","opts":["There are a book on the table.","There is two boys outside.","There is some juice in the bottle.","There am many questions.","There be a pencil here."],"correct":3,"explain":"셀 수 없는 명사 some juice는 단수 취급하므로 There is.","topic":"L5 There is"},{"no":7,"kind":"mc","pts":3,"stem":"빈칸에 가장 알맞은 것은? \"A detective should look ______ at the small details.\"","opts":["care","careful","carefully","carefulness","more carefulest"],"correct":3,"explain":"동사 look(살펴보다)을 수식하는 부사 carefully.","topic":"L5 단서 관찰"},{"no":8,"kind":"mc","pts":3,"stem":"윗글에서 Jina가 처음에 친구의 추측을 바로 받아들이지 않은 이유는?","opts":["She already knew the teacher's plan.","She wanted to check more clues.","She was afraid of the trophy.","She saw nobody in the room.","She did not understand English."],"correct":2,"explain":"Jina did not agree right away. She asked questions and looked at more clues.라는 표현이 직접적인 근거다.","topic":"5과 독해·추론","passage":"On Friday, a trophy disappeared from the science room. Jina found a wet umbrella near the door and muddy footprints on the floor. Her friend said, “It must be a student from outside.” Jina did not agree right away. She asked questions and looked at more clues. Later, she learned that the teacher had moved the trophy to a safe place before the rain started. Jina smiled. One clue was not enough to know the whole story."},{"no":9,"kind":"mc","pts":3,"stem":"윗글의 내용과 일치하는 것은?","opts":["Jina moved the trophy.","A student took the trophy.","The teacher moved the trophy to keep it safe.","There were no footprints in the room.","The umbrella was completely dry."],"correct":3,"explain":"the teacher had moved the trophy to a safe place가 정확한 내용이다.","topic":"5과 세부 내용 파악","passage":"On Friday, a trophy disappeared from the science room. Jina found a wet umbrella near the door and muddy footprints on the floor. Her friend said, “It must be a student from outside.” Jina did not agree right away. She asked questions and looked at more clues. Later, she learned that the teacher had moved the trophy to a safe place before the rain started. Jina smiled. One clue was not enough to know the whole story.","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 225\" role=\"img\" aria-label=\"단서 카드 세 장 젖은 우산 진흙 발자국 옮겨진 트로피\"><defs><marker id=\"ar39\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 Z\" fill=\"#315caa\"/><\/marker><\/defs><rect x=\"1\" y=\"1\" width=\"458\" height=\"223\" rx=\"15\" fill=\"#fff\"/><g font-family=\"system-ui,Apple SD Gothic Neo,sans-serif\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"36\" y=\"36\" width=\"386\" height=\"154\" rx=\"8\" fill=\"#f8fbff\" stroke=\"#b8c9e4\" stroke-width=\"1.6\"/><text x=\"230\" y=\"71\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"650\" fill=\"#244366\">Evidence Board<\/text><rect x=\"54\" y=\"93\" width=\"110\" height=\"61\" rx=\"8\" fill=\"#eaf3ff\" stroke=\"#b8c9e4\" stroke-width=\"1.6\"/><rect x=\"176\" y=\"93\" width=\"109\" height=\"61\" rx=\"8\" fill=\"#eaf3ff\" stroke=\"#b8c9e4\" stroke-width=\"1.6\"/><rect x=\"298\" y=\"93\" width=\"109\" height=\"61\" rx=\"8\" fill=\"#eaf3ff\" stroke=\"#b8c9e4\" stroke-width=\"1.6\"/><text x=\"109\" y=\"118\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"650\" fill=\"#244366\">wet<\/text><text x=\"109\" y=\"140\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"650\" fill=\"#244366\">umbrella<\/text><text x=\"229\" y=\"118\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"650\" fill=\"#244366\">muddy<\/text><text x=\"229\" y=\"140\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"650\" fill=\"#244366\">footprints<\/text><text x=\"351\" y=\"118\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"650\" fill=\"#244366\">moved<\/text><text x=\"351\" y=\"140\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"650\" fill=\"#244366\">trophy<\/text><\/g><\/svg>"},{"no":10,"kind":"mc","pts":3,"stem":"윗글의 교훈으로 가장 적절한 것은?","opts":["Never visit the science room.","Always trust the first guess.","A dry umbrella is the best clue.","Check enough evidence before deciding.","Teachers should never move anything."],"correct":4,"explain":"하나의 단서만으로 단정하지 않고 충분한 단서를 확인하는 태도가 핵심이다.","topic":"5과 글의 주제","passage":"On Friday, a trophy disappeared from the science room. Jina found a wet umbrella near the door and muddy footprints on the floor. Her friend said, “It must be a student from outside.” Jina did not agree right away. She asked questions and looked at more clues. Later, she learned that the teacher had moved the trophy to a safe place before the rain started. Jina smiled. One clue was not enough to know the whole story."},{"no":11,"kind":"mc","pts":4,"stem":"빈칸에 알맞은 것은? \"I want ______ less plastic.\"","opts":["use","to use","using","used","uses"],"correct":2,"explain":"want 뒤에서 목적어 역할을 하는 to부정사.","topic":"L6 to부정사"},{"no":12,"kind":"mc","pts":4,"stem":"다음 중 to부정사가 주어 역할을 하는 문장은?","opts":["I want to recycle.","To save water is important.","My plan is to walk to school.","She decided to help.","He needs to rest."],"correct":2,"explain":"To save water가 주어 역할.","topic":"L6 to부정사의 역할"},{"no":13,"kind":"mc","pts":4,"stem":"빈칸에 알맞은 것은? \"My dream is ______ the Earth.\"","opts":["protect","protects","protected","to protect","protecting to"],"correct":4,"explain":"be동사 뒤에서 보어 역할을 하는 to protect.","topic":"L6 to부정사 보어"},{"no":14,"kind":"mc","pts":4,"stem":"빈칸에 알맞은 것은? \"I think ______ we should use less water.\"","opts":["if","because","that","but","or"],"correct":3,"explain":"think의 목적어가 되는 절을 이끄는 접속사 that.","topic":"L6 접속사 that"},{"no":15,"kind":"mc","pts":4,"stem":"다음 중 접속사 that이 올바르게 사용된 문장은?","opts":["I know that the Earth needs our help.","I know that is the Earth needs help.","She thinks that to we recycle.","He said that to save water.","We believe that is important protect trees."],"correct":1,"explain":"that 뒤에 주어+동사를 갖춘 완전한 절이 이어진다.","topic":"L6 that절"},{"no":16,"kind":"mc","pts":4,"stem":"환경보호에 관한 대화를 자연스럽게 이어지도록 배열한 것은?\n(A) That's a great idea. Let's bring our own bottles.\n(B) We use too many paper cups every day.\n(C) What can we do to reduce waste?","opts":["(B) → (C) → (A)","(A) → (B) → (C)","(C) → (A) → (B)","(A) → (C) → (B)","(B) → (A) → (C)"],"correct":1,"explain":"문제 제기 (B) → 해결 방법 질문 (C) → 실천 제안 (A)의 순서로 대화가 자연스럽게 이어진다.","topic":"6과 대화 순서 배열"},{"no":17,"kind":"mc","pts":4,"stem":"윗글에 따르면 일회용 컵 사용량이 일주일 후 어떻게 변했는가?","opts":["36개에서 12개로 줄었다.","12개에서 36개로 늘었다.","36개에서 30개로 줄었다.","12개로 변함없이 유지됐다.","0개가 되었다."],"correct":1,"explain":"At first 36 cups a day, after one week only 12 cups a day라는 대조가 근거다.","topic":"6과 수치 독해","passage":"Our class tried a week without disposable cups. On Monday, many students forgot to bring their own bottles. At first, the class used 36 paper cups a day. After one week, students started carrying reusable bottles, and we used only 12 cups a day. We also saved leftover food and separated plastic and paper. Some students said this was difficult, but small actions made a real difference. We learned that protecting the Earth is something everyone can do.","fig":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 225\" role=\"img\" aria-label=\"사용한 일회용 컵 개수 막대그래프 이전 하루 36개, 이후 하루 12개\"><defs><marker id=\"ar40\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"4.5\" orient=\"auto\"><path d=\"M0 0 L9 4.5 L0 9 Z\" fill=\"#315caa\"/><\/marker><\/defs><rect x=\"1\" y=\"1\" width=\"458\" height=\"223\" rx=\"15\" fill=\"#fff\"/><g font-family=\"system-ui,Apple SD Gothic Neo,sans-serif\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><text x=\"230\" y=\"32\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"650\" fill=\"#244366\">Disposable Cups Per Day<\/text><rect x=\"65\" y=\"58\" width=\"330\" height=\"124\" rx=\"8\" fill=\"#f7faff\" stroke=\"#b8c9e4\" stroke-width=\"1.6\"/><text x=\"85\" y=\"89\" text-anchor=\"start\" font-size=\"14\" font-weight=\"650\" fill=\"#244366\">Before<\/text><rect x=\"170\" y=\"67\" width=\"186\" height=\"27\" rx=\"8\" fill=\"#d9a04a\" stroke=\"#d9a04a\" stroke-width=\"1.6\"/><text x=\"363\" y=\"86\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"650\" fill=\"#244366\">36<\/text><text x=\"85\" y=\"143\" text-anchor=\"start\" font-size=\"14\" font-weight=\"650\" fill=\"#244366\">After<\/text><rect x=\"170\" y=\"121\" width=\"62\" height=\"27\" rx=\"8\" fill=\"#4fa491\" stroke=\"#4fa491\" stroke-width=\"1.6\"/><text x=\"243\" y=\"141\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"650\" fill=\"#244366\">12<\/text><text x=\"230\" y=\"208\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\" fill=\"#244366\">Our class's one-week challenge<\/text><\/g><\/svg>"},{"no":18,"kind":"mc","pts":4,"stem":"윗글의 제목으로 가장 적절한 것은?","opts":["How to Buy More Cups","Small Actions for the Earth","The Best Detective in School","Why Plastic Is Always Better","The History of School Lunch"],"correct":2,"explain":"재사용 용기, 남은 음식 아끼기, 분리배출처럼 작은 실천으로 쓰레기를 줄였다는 글이다.","topic":"6과 주제 추론","passage":"Our class tried a week without disposable cups. On Monday, many students forgot to bring their own bottles. At first, the class used 36 paper cups a day. After one week, students started carrying reusable bottles, and we used only 12 cups a day. We also saved leftover food and separated plastic and paper. Some students said this was difficult, but small actions made a real difference. We learned that protecting the Earth is something everyone can do."},{"no":19,"kind":"mc","pts":4,"stem":"다음 중 \"I believe that recycling matters.\"에서 that의 쓰임과 같은 것은?","opts":["That bag is mine.","Look at that!","She said that we can help.","I like that blue cup.","Is that your pen?"],"correct":3,"explain":"문장 안에 완전한 절을 이끄는 접속사 that은 ③.","topic":"L6 접속사 that 구별"},{"no":20,"kind":"mc","pts":4,"stem":"다음 문장에 가장 알맞은 것은? \"There ______ a bottle and two cups on the table.\"","opts":["are","is","have","am","be"],"correct":2,"explain":"There be 구문의 동사는 바로 뒤에 오는 명사 a bottle에 맞춘다.","topic":"L5·L6 통합 문법"},{"no":21,"kind":"essay","pts":6,"stem":"주어진 단어를 모두 사용하여 \"이 가방은 저 가방보다 무겁다.\"를 영어로 쓰시오. (this bag / heavy / than / that bag)","correct":"This bag is heavier than that bag.","rubric":"주어·동사 구성 2점, heavier 2점, than 비교대상 2점.","topic":"L5 비교급 쓰기"},{"no":22,"kind":"essay","pts":6,"stem":"다음 문장을 영어로 쓰시오. \"책상 위에 단서 세 개가 있다.\" (There로 시작, clue 사용)","correct":"There are three clues on the desk.","rubric":"There are 2점, three clues 2점, on the desk 2점.","topic":"L5 There are 쓰기"},{"no":23,"kind":"essay","pts":6,"stem":"주어진 단어를 바르게 배열하여 한 문장을 완성하시오. (to / wants / reduce / waste / Jina)","correct":"Jina wants to reduce waste.","rubric":"주어+동사 2점, to부정사 목적어 구성 2점, 어순·철자 2점.","topic":"L6 to부정사 쓰기"},{"no":24,"kind":"essay","pts":6,"stem":"다음 두 문장을 접속사 that을 사용해 한 문장으로 합치시오. \"I think. We can save energy.\"","correct":"I think that we can save energy.","rubric":"I think 2점, that 2점, 완전한 절 구성 2점.","topic":"L6 that절 쓰기"},{"no":25,"kind":"essay","pts":6,"stem":"빈칸에 필요한 말을 써서 대화를 완성하시오.\nA: \"Can you please ( ① ) off the water?\"\nB: \"Sure. I ( ② ).\"\n단, ①은 동사원형 한 단어, ②는 조동사 한 단어로 쓰시오.","correct":"① turn ② will","rubric":"각 빈칸 정답 3점.","topic":"L6 요청 표현"}]}]</script>
<script>
(()=>{'use strict';
const all=JSON.parse(document.getElementById('examdata').textContent);
const STORE='daesin2026_midterm_visual_v5';
const ICONS={'수학':'∠','국어':'가','과학':'⚗','영어':'Aa'};
const root=document.getElementById('root');
let state,active=null,current=0,view='home',timerId=null,lastTick=0;
function blankState(){return {subjects:Object.fromEntries(all.map(s=>[s.id,{answers:Array(25).fill(null),flags:Array(25).fill(false),scores:Array(5).fill(null),submitted:false,elapsed:0}]))};}
function load(){try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&x.subjects&&all.every(s=>x.subjects[s.id]&&x.subjects[s.id].answers?.length===25))return x;}catch(e){}return blankState();}
state=load();
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
function esc(v){return String(v==null?'':v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
function subj(){return all.find(x=>x.id===active)}
function astate(){return state.subjects[active]}
function isDone(a){return a!=null&&String(a).trim().length>0}
function sumDone(s){return s.answers.filter(isDone).length}
function attachVisual(q){return (q.passage?`<div class="reading-passage"><div class="reading-title">[지문] 다음 글을 읽고 물음에 답하시오.</div>${esc(q.passage)}</div>`:'')+(q.fig?`<div class="question-figure">${q.fig}</div>`:'')}function score(i){return i<10?3:i<20?4:6}
function mcGrade(s,subject){return subject.items.slice(0,20).reduce((n,q,i)=>n+(s.answers[i]===q.correct?q.pts:0),0)}
function fmt(secs){secs=Math.max(0,Math.floor(secs));return String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null} if(lastTick&&active&&view==='test'){astate().elapsed+=Math.max(0,Math.floor((Date.now()-lastTick)/1000));save()}lastTick=0}
function startTimer(){stopTimer();lastTick=Date.now();timerId=setInterval(()=>{if(view!=='test')return;const delta=Math.floor((Date.now()-lastTick)/1000);if(delta>=1){astate().elapsed+=delta;lastTick+=delta*1000;save()}const el=document.getElementById('timer');if(el){const left=2700-astate().elapsed;el.textContent='⏱ '+(left>0?fmt(left):'시간 경과');el.classList.toggle('danger',left<300)}} ,1000)}
function goHome(){stopTimer();active=null;view='home';draw()}
function openSubject(id){stopTimer();active=id;current=0;view=state.subjects[id].submitted?'result':'test';draw()}
function pillStatus(s){if(s.submitted){const g=mcGrade(s,all.find(x=>x.id===active));return '채점 완료 · '+g+'/70점'}return sumDone(s)+'/25문항 응답';}
function drawHome(){const subs=all.map(s=>{const d=state.subjects[s.id],no=sumDone(d),done=d.submitted;return `<button class="subject" data-open="${s.id}"><span class="subicon">${ICONS[s.id]}</span><b>${s.id}</b><span class="scope">${esc(s.scope)}</span><div class="subfoot"><span>${done?'채점 결과 보기':(no?'이어 풀기':'시험 시작')}</span><span>${done?mcGrade(d,s)+'/70점':no+'/25문항'} →</span></div></button>`}).join('');return `<section class="intro"><div class="eyebrow">2026학년도 2학기 · 개인 연습용</div><h1>태블릿 실전 모의고사</h1><p class="lead">과목을 누르고 터치로 정답을 고르세요. 서술형은 직접 입력하고, 시험을 제출하면 객관식은 자동채점됩니다.</p></section><div class="subject-grid">${subs}</div><div class="panel bottom-section"><h2 style="font-size:17px;margin:0 0 10px">시험 방식</h2><p class="note">과목당 <b>25문항 · 100점</b> (객관식 20문항 70점 + 서술형 5문항 30점). 화면은 문항별로 넘어가며, 45분 타이머와 문항 이동 표가 있습니다. 4과목 총 100문항입니다.</p><div class="callout">중요: 도형 그림, 과학 실험·그래프, 국어·영어 독해 지문을 추가한 <b>비공식 창작 모의고사</b>입니다. <b>그림은 이해를 돕기 위한 개략도이며 문제에 제시한 각도와 길이의 정확한 비율을 보장하지 않습니다.</b> 학교 평가계획 첨부 파일을 열람하지 못해 정확한 문항 수·배점은 확인되지 않았습니다.</div><h3 style="font-size:15px">학습기록 보관</h3><p class="note">입력한 답은 이 기기의 같은 브라우저 저장공간에 자동 저장됩니다. <b>기기가 바뀌면 답안이 자동 동기화되지 않습니다.</b> 백업 파일을 저장해 다른 기기에서 불러올 수 있습니다.</p><div class="tool-actions"><button class="btn" data-backup>답안 백업</button><button class="btn" data-import>백업 불러오기</button><button class="btn danger" data-clearall>전체 답안 초기화</button></div></div><div class="footer">학습용으로만 사용 · 실전유형 보완판 V5 · 사진 및 교과서 원문 무단 복제 없음</div>`}
function drawTest(){const s=subj(),d=astate(),q=s.items[current],answer=d.answers[current],n=sumDone(d),left=2700-d.elapsed,opts=q.kind==='mc'?`<div class="choices">${q.opts.map((o,i)=>`<button class="choice ${answer===i+1?'selected':''}" data-choice="${i+1}"><span class="circle">${'①②③④⑤'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`:`<label for="essay" class="note" style="display:block;margin:0 0 5px">서술형 답안 작성</label><textarea class="response" id="essay" placeholder="답안을 여기에 입력하세요. 풀이 과정이나 근거도 적어보세요.">${esc(answer||'')}</textarea><p class="entryhelp">서술형은 시험 제출 후 모범답안과 비교해 스스로 채점합니다.</p>`;
return `<div class="exam-head"><div><button class="btn ghost" data-home>← 과목 선택</button><h1>${s.id} <span class="muted" style="font-size:14px;font-weight:500">실전 모의고사</span></h1><div class="note">${esc(s.scope)}</div></div><div class="timer" id="timer">⏱ ${left>0?fmt(left):'시간 경과'}</div></div><div class="progress"><div style="width:${n/25*100}%"></div></div><div class="exam-small"><span>${n}/25문항 답변 완료</span><span>객관식 70점 · 서술형 30점</span></div><section class="panel" style="margin-top:18px"><div class="question-top"><span class="pill">${String(q.no).padStart(2,'0')} / 25문항　·　${q.pts}점</span><button class="mark ${d.flags[current]?'active':''}" data-flag>${d.flags[current]?'★ 체크됨':'☆ 나중에 확인'}</button></div><div class="q-stem">${esc(q.stem)}</div>${attachVisual(q)}${opts}<div class="question-foot"><button class="btn" data-prev ${current===0?'disabled':''}>← 이전</button><button class="btn primary" data-next>${current===24?'답안 전체 보기':'다음 문제 →'}</button></div></section><div class="pageDots">${s.items.map((x,i)=>`<button class="dot ${isDone(d.answers[i])?'done':''} ${current===i?'current':''} ${d.flags[i]?'flag':''}" data-jump="${i}" title="${i+1}번${d.flags[i]?' (체크됨)':''}">${i+1}</button>`).join('')}</div><div class="submitbox"><div class="desc">노란 테두리: 다시 확인할 문제 · 파란색: 답변한 문제</div><button class="btn primary" data-submit>시험 제출 및 채점</button></div><p class="footer">제출 전에는 정답·해설이 보이지 않습니다. 모든 답은 기기에 자동 저장됩니다.</p>`;}
function drawResult(){const s=subj(),d=astate(),mc=mcGrade(d,s),hasAll=d.scores.every(x=>x!==null),written=d.scores.reduce((a,b)=>a+(Number.isFinite(+b)&&b!=null?+b:0),0),ungraded=d.scores.filter(x=>x===null).length,unanswered=25-sumDone(d);let report=s.items.map((q,i)=>{let user=d.answers[i];if(q.kind==='mc'){let ok=user===q.correct;return `<div class="review-item"><span class="pill">${i+1}번 · ${q.pts}점 · ${esc(q.topic)}</span><h3>${esc(q.stem)}</h3>${attachVisual(q)}<div class="answer-row ${ok?'correct':'wrong'}">${ok?'✓ 정답':'✕ '+(user==null?'미응답':'오답')} · 내 답: ${user? '①②③④⑤'[user-1]+' '+esc(q.opts[user-1]):'없음'} / 정답: ${'①②③④⑤'[q.correct-1]} ${esc(q.opts[q.correct-1])}</div><div class="essay-box">${esc(q.explain)}</div></div>`}
let score=d.scores[i-20];return `<div class="review-item"><span class="pill">${i+1}번 · 6점 · ${esc(q.topic)}</span><h3>${esc(q.stem)}</h3>${attachVisual(q)}<div class="essay-box"><b>내가 쓴 답</b>\n${esc(user||'(작성하지 않음)')}</div><div class="essay-box"><b>모범답안</b>\n${esc(q.correct)}\n\n<b>채점 기준</b>\n${esc(q.rubric)}</div><label class="note" style="display:block;margin:12px 0 5px">모범답안과 비교한 점수 (0~6점)</label><select class="select-score" data-score="${i-20}"><option value="" ${score===null?'selected':''}>미채점</option>${[0,1,2,3,4,5,6].map(n=>`<option value="${n}" ${score===n?'selected':''}>${n}점</option>`).join('')}</select></div>`}).join('');return `<div class="exam-head"><div><button class="btn ghost" data-home>← 과목 선택</button><h1>${s.id} 시험 결과</h1><p class="note">객관식 자동채점 완료 · 서술형 5문항은 직접 채점</p></div></div><div class="result-cards"><div class="stat"><small>객관식 점수</small><strong>${mc}<span style="font-size:13px">/70</span></strong></div><div class="stat"><small>서술형 점수</small><strong>${written}<span style="font-size:13px">/30</span></strong></div><div class="stat"><small>총점</small><strong id="total">${hasAll?mc+written:'미확정'}${hasAll?'<span style="font-size:13px">/100</span>':''}</strong></div></div>${ungraded?`<div class="nudge">서술형 ${ungraded}문항의 점수를 정하면 총점이 표시됩니다. 미채점은 0점으로 간주하지 않습니다.</div>`:''}${unanswered?`<div class="nudge">미응답 문항 ${unanswered}개가 있습니다.</div>`:''}<div class="tool-actions" style="margin-bottom:20px"><button class="btn" data-summary>성적표 저장(.txt)</button><button class="btn" data-backup>전체 답안 백업</button><button class="btn danger" data-restart>이 과목 다시 풀기</button></div><section class="panel"><h2 style="margin:0 0 14px;font-size:20px">문항별 정답 및 해설</h2><div style="font-size:13px;color:var(--muted)">정답·풀이를 확인하고 오답의 개념을 복습하세요.</div>${report}</section><div class="footer">서술형은 예시답안이므로 취지가 같다면 다른 표현도 정답이 될 수 있습니다.</div>`;}
function draw(){root.innerHTML=view==='home'?drawHome():view==='test'?drawTest():drawResult();if(view==='test')startTimer();window.scrollTo({top:0,behavior:'instant'});}
function choice(i){astate().answers[current]=i;save();const area=root.querySelector('.choices');if(area){area.querySelectorAll('[data-choice]').forEach(b=>{let yes=Number(b.dataset.choice)===i;b.classList.toggle('selected',yes)});}updateMini()}
function updateMini(){let d=astate(),n=sumDone(d);const p=root.querySelector('.progress div');if(p)p.style.width=(n/25*100)+'%';const sm=root.querySelector('.exam-small span');if(sm)sm.textContent=n+'/25문항 답변 완료';let dots=root.querySelectorAll('[data-jump]');dots.forEach((e,i)=>e.classList.toggle('done',isDone(d.answers[i])))}
function nav(i){stopTimer();current=Math.max(0,Math.min(24,i));draw()}
function finish(){const d=astate(),n=sumDone(d);if(n<25&&!confirm(`아직 ${25-n}문항에 답하지 않았습니다. 제출할까요?`))return;if(!confirm('제출하면 정답과 해설이 공개됩니다. 시험을 제출하시겠습니까?'))return;stopTimer();d.submitted=true;save();view='result';draw()}
function download(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function report(){const d=astate(),s=subj(),g=mcGrade(d,s),hasAll=d.scores.every(x=>x!=null),essays=d.scores.reduce((p,v)=>p+(v==null?0:+v),0);let text=`부산대신중학교 중1 2학기 ${active} 모의고사 성적표\n`+`학습용 비공식 시험 / 생성일: ${new Date().toLocaleString('ko-KR')}\n`+`객관식: ${g}/70점\n서술형: ${hasAll?essays+'/30점':'미채점'}\n총점: ${hasAll?g+essays+'/100점':'미확정'}\n\n`;s.items.forEach((q,i)=>{text+=`${i+1}번 (${q.pts}점) ${q.topic}\n 내 답: ${d.answers[i]??'(미응답)'}\n ${q.kind==='mc'?'정답: '+q.correct:'채점: '+(d.scores[i-20]??'미채점')+'/6점'}\n`});download('대신중_중간고사_'+active+'_성적표.txt',text)}
function initBackup(){download('대신중_중간고사_답안백업.json',JSON.stringify({version:5,exportedAt:new Date().toISOString(),data:state},null,2),'application/json')}
function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result),x=d.data;if(d.version!==5)throw Error('구버전 답안은 문항이 달라 불러올 수 없습니다.');if(!x||!x.subjects||!all.every(s=>x.subjects[s.id]&&x.subjects[s.id].answers.length===25))throw Error('파일 형식 불일치');if(confirm('현재 저장된 답안을 백업 내용으로 덮어쓸까요?')){stopTimer();state=x;save();goHome();alert('백업을 불러왔습니다.')}}catch(e){alert('백업 파일을 읽을 수 없습니다.')}};reader.readAsText(file)}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const z=b.dataset;if(z.home!==undefined){goHome();return}if(z.open){openSubject(z.open);return}if(z.choice){choice(Number(z.choice));return}if(z.next!==undefined){if(current===24){nav(24);root.querySelector('[data-submit]')?.scrollIntoView({behavior:'smooth',block:'center'})}else nav(current+1);return}if(z.prev!==undefined){nav(current-1);return}if(z.jump!==undefined){nav(Number(z.jump));return}if(z.flag!==undefined){let d=astate();d.flags[current]=!d.flags[current];save();b.classList.toggle('active');b.textContent=d.flags[current]?'★ 체크됨':'☆ 나중에 확인';const dot=root.querySelector(`[data-jump="${current}"]`);if(dot)dot.classList.toggle('flag',d.flags[current]);return}if(z.submit!==undefined){finish();return}if(z.backup!==undefined){initBackup();return}if(z.summary!==undefined){report();return}if(z.import!==undefined){document.getElementById('fileinput').click();return}if(z.clearall!==undefined){if(confirm('4과목의 모든 답안을 삭제할까요? 복구하려면 먼저 백업하세요.')){state=blankState();save();goHome()}return}if(z.restart!==undefined){if(confirm(`${active}의 기존 답안과 점수를 지우고 다시 풀까요?`)){stopTimer();state.subjects[active]=blankState().subjects[active];save();view='test';current=0;draw()}return}});
root.addEventListener('input',e=>{if(e.target.id==='essay'){astate().answers[current]=e.target.value;save();updateMini()}});
root.addEventListener('change',e=>{if(e.target.dataset.score!==undefined){let i=Number(e.target.dataset.score);astate().scores[i]=e.target.value===''?null:Number(e.target.value);save();let prevY=window.scrollY;root.innerHTML=drawResult();window.scrollTo(0,prevY)}});
const fileinput=document.createElement('input');fileinput.type='file';fileinput.accept='.json,application/json';fileinput.id='fileinput';fileinput.classList.add('hidden');fileinput.addEventListener('change',()=>importBackup(fileinput.files?.[0]));document.body.appendChild(fileinput);
document.getElementById('homeBtn').addEventListener('click',goHome);
window.addEventListener('beforeunload',()=>{if(lastTick&&active&&view==='test'){astate().elapsed+=Math.floor((Date.now()-lastTick)/1000);save()}});
draw();
})();
</script></body></html>
